name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Comprova la funció d'IA
        run: node --check api/ia.js && node --check api/_model.js && node --check api/tts.js && node --check api/_auth.js && node --check api/stt.js && node --check api/status.js
      - name: Versió d'un sol fitxer (visor)
        run: node scripts/inline.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: parla-c1-viewer
          path: dist-viewer/parla-c1.html
          retention-days: 30
      - name: Publica la versió de visor a la branca viewer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp dist-viewer/parla-c1.html /tmp/parla-c1.html
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan viewer
          git rm -rf --quiet .
          cp /tmp/parla-c1.html parla-c1.html
          git add parla-c1.html
          git commit -m "Versió de visor de ${GITHUB_SHA::7}"
          git push -f origin viewer
