s i 'ls",short:"davant del verb sempre els; los només darrere de verb acabat en consonant o u (veure-los), 'ls darrere de vocal (compra'ls)",body:"<p>Davant: <b>els</b> veig. Darrere: veure-<b>los</b>, fer-<b>los</b>, compra'<b>ls</b>.</p><p>«Los veig» és incorrecte.</p>",forms:["els","los"],keys:["plural"]},{id:"ho",title:"Ho: el pronom neutre",short:"substitueix una frase sencera o una idea (això): ho sé, no ho entenc",body:"<p>Saps que plourà? Sí, <b>ho</b> sé. Diu que vindrà → <b>ho</b> diu.</p><p>No es fa servir per a persones ni noms concrets.</p>",forms:["ho"],keys:["neutre","frase sencera"]},{id:"apos",title:"Apostrofació: l', m', t', n'",short:"davant de vocal o h, el, la, em, et, en s'apostrofen: l'he vist, m'agrada, t'estimo",body:"<p>Davant del verb: <b>l'</b>he vist, <b>m'</b>agrada, <b>t'</b>escric.</p><p>Davant consonant, forma plena: <b>el</b> veig, <b>em</b> diu, <b>et</b> truco.</p>",forms:["l'","m'","t'","et","em","te","me"],keys:["apostrof","davant vocal"]},{id:"comb",title:"Combinacions i posició",short:"primer l'indirecte i després el directe: me'l, te la, li ho; darrere de l'imperatiu o l'infinitiu, amb guionet",body:"<p>em + el = <b>me'l</b> · et + ho = <b>t'ho</b> · li + ho = <b>li ho</b>.</p><p>Darrere del verb: dona-<b>me'l</b>, explica-<b>li-ho</b>, veure-<b>la</b>.</p>",forms:["me'l","me el","m'el","te l'","t'ho","te ho"],keys:["combinació","guionet","imperatiu"]},{id:"temps",title:"Perifràstic o imperfet",short:"perifràstic (vaig fer) per a fets puntuals; imperfet (feia) per a descripcions i costums",body:"<p>Ahir <b>vaig escriure</b> una carta (fet). Quan <b>era</b> petit, <b>escrivia</b> molt (costum).</p>",forms:["vaig escriure","escrivia","escriuré","me'n vaig anar","me'n anava","em vaig"],keys:["perifràstic","imperfet"]}],u2:[{id:"hi",title:"Hi: lloc i complements amb a, en, amb",short:"substitueix un lloc o un complement amb a, en, amb: hi vaig, hi penso, hi confio",body:"<p>Vaig a la platja → <b>hi</b> vaig. Penso en tu → <b>hi</b> penso. Confio en ell → <b>hi</b> confio.</p><p>Darrere del verb: ves-<b>hi</b>, anar-<b>hi</b>.</p>",forms:["hi","m'hi"],keys:["lloc","pensar en","confiar en"]},{id:"en",title:"En: de, quantitats i noms sense article",short:"substitueix complements amb de, quantitats i noms sense article: en parlem, en tinc dos, no en vull",body:"<p>Parlem del viatge → <b>en</b> parlem. Tens fills? <b>En</b> tinc dos. Vols pa? No, no <b>en</b> vull.</p><p>Davant vocal <b>n'</b>: n'hem parlat. Darrere de vocal <b>'n</b>: parla'n.</p>",forms:["en","n'","'n","me'n","d'"],keys:["quantitat","numeral","parlar de","venir de"]},{id:"nhi",title:"N'hi ha / hi ha",short:"hi ha és existencial i sempre va en singular; amb quantitat: n'hi ha",body:"<p><b>Hi ha</b> molts pisos (mai «hi han»). Quantes cadires hi ha? <b>N'hi ha</b> sis. No <b>n'hi ha</b> prou.</p>",forms:["n'hi","hi ha","hi han"],keys:["existencial"]},{id:"cd2",title:"Amb article: el, la, els, les",short:"si el nom porta article o és concret, és complement directe: el, la, els, les (no en)",body:"<p>Vols <u>el</u> llibre? Sí, <b>el</b> vull. Vols <u>llibres</u>? Sí, <b>en</b> vull.</p>",forms:["el","la","les","els","l'"],keys:["article"]},{id:"formal",title:"Carta formal",short:"salutació, tractament de vostè coherent, petició amb subjuntiu i comiat formal",body:"<p><b>Benvolgut senyor,</b> · Em dirigeixo a vostè per… · Per tot això, li sol·licito que… · <b>Atentament,</b></p>",forms:["vostè","tu","vosaltres","atentament,","petons,","fins aviat!"],keys:["formal","carta"]}],u3:[{id:"que",title:"Que (sense preposició)",short:"relatiu sense preposició, per a persones i coses: el llibre que llegeixo, la noia que ve",body:"<p>Sense accent. Fa de subjecte o complement directe.</p><p>La feina <b>que</b> m'agrada · Els companys <b>que</b> hi van anar.</p>",forms:["que"],keys:["sense preposició"]},{id:"que2",title:"Què (amb preposició, coses)",short:"amb preposició i referit a coses porta accent: el tema de què parlem, la raó per què",body:"<p>El projecte <b>en què</b> treballo · El tema <b>de què</b> parlàvem.</p><p>També interrogatiu: no sé <b>què</b> vols.</p>",forms:["què","de què","amb què","en què","a què"],keys:["preposició","cosa"]},{id:"qui",title:"Qui (amb preposició, persones)",short:"amb preposició i referit a persones: la persona amb qui parlo, a qui escric",body:"<p>La companya <b>amb qui</b> treballo · La persona <b>a qui</b> vaig escriure.</p><p>Sense preposició, en una relativa especificativa, no: la noia <b>que</b> ve (no «qui ve»).</p>",forms:["qui","amb qui","a qui"],keys:["persona"]},{id:"on",title:"On (llocs)",short:"per a llocs: l'empresa on treballo (= en què, en la qual)",body:"<p>La ciutat <b>on</b> vaig néixer · El despatx <b>on</b> treballa.</p>",forms:["on"],keys:["lloc"]},{id:"qual",title:"El qual, la qual (formal)",short:"relatiu compost formal: amb preposició (amb el qual) o entre comes; mai sense preposició en una especificativa",body:"<p>Les raons <b>per les quals</b>… · Un model <b>amb el qual</b> m'identifico.</p><p>Possessiu: l'oferta, els requisits <b>de la qual</b>…</p>",forms:["el qual","la qual","els quals","les quals","quals","qual"],keys:["formal","compost"]},{id:"laque",title:"«La que» darrere de preposició: no",short:"darrere de preposició no es diu «la que» ni «de que»: cal la qual o què",body:"<p>❌ la raó per la que → ✅ per la qual / per què.</p><p>«El que» sí que és correcte quan vol dir «allò que»: això és el que vull.</p>",forms:["la que","de que","amb que","en que","que els seus requisits","quins requisits"],keys:["la que"]}],u4:[{id:"per",title:"Per",short:"causa, mitjà, lloc de pas, temps aproximat, preu, agent i manera: per la pluja, per telèfon, per Nadal",body:"<p>Causa: <b>per</b> la vaga · Mitjà: <b>per</b> correu · Lloc de pas: <b>per</b> la porta · Temps: <b>per</b> Nadal · Preu: <b>per</b> 20 € · Agent: escrit <b>per</b> la directora.</p><p>Davant d'infinitiu, <b>per</b> sempre és correcte.</p>",forms:["per","pel","pels"],keys:["causa","mitjà","agent","preu","lloc de pas"]},{id:"pera",title:"Per a",short:"destinatari o finalitat davant d'un nom: un regal per a tu, una sala per a reunions",body:"<p><b>Per a</b> tu · <b>per a</b> les escoles · un carril <b>per a</b> bicicletes.</p><p>Contraccions: per a + el = <b>per al</b>, per a + els = <b>per als</b>.</p>",forms:["per a","per al","per als"],keys:["destinatari","finalitat"]},{id:"nopera",title:"«Pera», «a per»: no",short:"no són preposicions catalanes (la pera és una fruita!)",body:"<p>❌ pera tu · ❌ vaig a per pa → ✅ per a tu · vaig a buscar pa.</p>",forms:["pera","a per"]},{id:"mes",title:"Més / menys … que",short:"superioritat i inferioritat: més petita que, menys aigua que; amb quantitats exactes, més de / menys de",body:"<p>Eivissa és <b>més</b> petita <b>que</b> Mallorca. Ha plogut <b>menys que</b> l'any passat.</p><p>Amb una xifra: <b>més de</b> 100 persones.</p><p>Millor, pitjor, major, menor ja són comparatius: ❌ més pitjor.</p>",forms:["que","més","menys","de","menys de","menor","molt"],keys:["superioritat","més"]},{id:"tan",title:"Tan, tant … com",short:"tan + adjectiu o adverbi; tant (concordat) + nom; tant com amb verb",body:"<p><b>tan</b> gran <b>com</b> · <b>tanta</b> calor <b>com</b> · <b>tants</b> turistes <b>com</b> · corre <b>tant com</b> jo.</p>",forms:["tan","tant","tanta","tants","tantes","com"],keys:["igualtat"]},{id:"prop",title:"Com més…, més…",short:"comparació proporcional: com més llegeixes, més aprens (mai «contra més»)",body:"<p><b>Com més</b> plàstic fem servir, <b>més</b> contaminem.</p>",forms:["contra","quant"],keys:["proporcional"]},{id:"dades",title:"Lèxic per descriure dades",short:"augmentar, disminuir, disparar-se, mantenir-se estable, assolir el màxim, duplicar-se, reduir-se a la meitat",body:"<p>Ha <b>augmentat</b> un 20 % · ha <b>caigut bruscament</b> · s'ha <b>mantingut estable</b> · ha <b>assolit el màxim</b> · s'ha <b>duplicat</b>.</p>",keys:["xifra","gràfic","duplic","tripl"]}],u5:[{id:"agudes",title:"Agudes (síl·laba tònica final)",short:"porten accent si acaben en vocal, -as, -es, -is, -os, -us, -en, -in: cafè, anglès, camí, també",body:"<p>caf<b>è</b> · angl<b>è</b>s · cam<b>í</b> · tamb<b>é</b> · atenci<b>ó</b>.</p><p>Sense accent: medicament, dimarts (acaben d'una altra manera).</p>",keys:["aguda"]},{id:"planes",title:"Planes (penúltima síl·laba)",short:"porten accent si NO acaben en vocal, -as, -es, -is, -os, -us, -en, -in: càrrec, fàcil; examen no",body:"<p>c<b>à</b>rrec · f<b>à</b>cil · l<b>à</b>pis… però <b>examen</b>, <b>jove</b> sense accent.</p><p>Les acabades en -ia, -ie, -io, -ua… es tracten com a esdrúixoles: paci<b>è</b>ncia, hist<b>ò</b>ria.</p>",keys:["plana"]},{id:"esdr",title:"Esdrúixoles",short:"sempre porten accent: telèfon, àrea, anàlisi, exàmens",body:"<p>tel<b>è</b>fon · <b>à</b>rea · an<b>à</b>lisi · ex<b>à</b>mens.</p>",keys:["esdrúixola"]},{id:"obert",title:"Accent obert o tancat",short:"à sempre obert; è i ò obertes, é i ó tancades; í i ú sempre tancats",body:"<p>caf<b>è</b> (obert) · tamb<b>é</b> (tancat) · atenci<b>ó</b> (tancat) · hist<b>ò</b>ria (obert).</p>",keys:["obert","tancat"]},{id:"diacr",title:"Accents diacrítics (des del 2017)",short:"només en queden 15: bé, déu, és, mà, més, món, pèl, què, sé, sí, sòl, són, té, ús, vós",body:"<p><b>té</b> (tenir) / te (beguda) · <b>és</b> (ser) / es (pronom) · <b>sé</b> (saber) / se (pronom) · <b>són</b> (ser) / son (dormir).</p><p>Sense accent ara: soc, dona, adeu, net, vens, venen.</p>",forms:["té","te","és","es","sé","se","són","son","soc","sóc","sòc","adeu","adéu","adèu"],keys:["diacrític","2017"]},{id:"apos5",title:"Apòstrof",short:"el, la i de s'apostrofen davant de vocal o h; la no s'apostrofa davant de i/u àtones: la infermera, la universitat",body:"<p><b>l'</b>hospital · <b>l'</b>àvia · <b>d'</b>Eivissa · però <b>la</b> infermera, <b>la</b> universitat, <b>la</b> història.</p>",forms:["l'hospital","el hospital","lo hospital","la infermera","l'infermera","le infermera","l'àvia","la àvia","d'eivissa","de eivissa","la universitat","l'universitat","le universitat"],keys:["apostrof"]},{id:"essa",title:"S, ss, c, ç, z",short:"so sonor: s entre vocals (casa), z a principi o darrere de consonant (zero); so sord: ss entre vocals (pressa), ç davant a/o/u (plaça), c davant e/i",body:"<p>ca<b>s</b>a / ca<b>ss</b>a · <b>z</b>ero · pre<b>ss</b>ió · pla<b>ç</b>a · aten<b>c</b>ió.</p>",forms:["zero","sero","cero","pressió","presió","pressio","plaça","plassa","plaza","pressa","presa","preza","atenció","atensió","atenciò"],keys:["essa","sonor","sord"]},{id:"ll",title:"Ela geminada",short:"s'escriu l·l, amb punt volat: col·legi, intel·ligent, al·lèrgia",body:"<p>co<b>l·l</b>egi · inte<b>l·l</b>igent · a<b>l·l</b>èrgia · penici<b>l·l</b>ina.</p>",forms:["col·legi","colegi","col.legi","intel·ligent","inteligent","intelligent"],keys:["geminada"]},{id:"inst",title:"La instància",short:"dades · EXPOSO (fets, «Que…») · SOL·LICITO («Que…» + subjuntiu) · lloc i data · destinatari al peu en majúscules",body:"<p><b>EXPOSO:</b> 1. Que… 2. Que…</p><p><b>SOL·LICITO:</b> Que em concedeixin…</p>",keys:["exposo","sol·licito","instància"]}],u7:[{id:"subj-que",title:"Verb + que + subjuntiu",short:"voler, esperar, demanar, necessitar, és important que… + subjuntiu (si els subjectes són diferents)",body:"<p>Vull <b>que vinguis</b> · Espero <b>que et vagi</b> bé · És important <b>que facin</b>…</p><p>Mateix subjecte → infinitiu: vull <b>venir</b>.</p>",forms:["vinguis","et vagi","facin","tinguis","fem","plogui","vinguessis","instal·lés","estudiïs"],keys:["voler que","esperar que","important que","demanar que"]},{id:"subj-op",title:"Opinió negada i dubte",short:"crec que + indicatiu · no crec que / dubto que + subjuntiu",body:"<p>Crec que <b>és</b> útil · No crec que <b>sigui</b> útil · Dubto que <b>arribin</b>.</p><p>Saber que (certesa) → indicatiu: sé que <b>arribaran</b>.</p>",forms:["sigui","és","arribin","arribaran"],keys:["opinió","dubtar","no crec"]},{id:"subj-temps",title:"Quan, abans que, perquè, encara que",short:"quan + futur → subjuntiu (quan arribis) · abans que, perquè (finalitat), a fi que + subjuntiu",body:"<p><b>Quan arribis</b>, truca'm (mai «quan arribaràs»).</p><p><b>Abans que</b> es faci fosc · T'ho explico <b>perquè</b> ho entenguis · <b>Encara que</b> insisteixis…</p>",forms:["arribis","es faci","entenguis","insisteixis","tingui","puguis"],keys:["quan","abans que","finalitat","concessiva"]},{id:"cond",title:"Condicionals amb si",short:"si + present → futur · si + imperfet de subjuntiu → condicional · mai «si tindria»",body:"<p>Si <b>fa</b> sol, <b>anirem</b> a la platja.</p><p>Si <b>tingués</b> temps, <b>aniria</b> al curs.</p><p>Si ho <b>hagués sabut</b>, t'ho <b>hauria dit</b>.</p>",forms:["tingués","tindria","hauria","hagués","anirem","aniríem","pogués","Si tingués diners, compraria un ordinador nou."],keys:["si","hipòtesi","condicional"]},{id:"cortesia",title:"Condicional de cortesia i recomanació",short:"podria…?, m'agradaria que…, hauríem de…, caldria que + imperfet de subjuntiu",body:"<p><b>Podria</b> ajudar-me? · <b>M'agradaria que</b> l'escola oferís… · <b>Caldria que</b> el govern invertís…</p>",forms:["podria","tingués","invertís","d'"],keys:["cortesia","caldria","agradaria"]}],u8:[{id:"comb-1",title:"Em, et, ens, us + el, la, els, en, ho",short:"me'l, te la, me'ls, m'ho, te'n · ens el, us la, ens ho, us en",body:"<p>em + el = <b>me'l</b> · et + la = <b>te la</b> · em + els = <b>me'ls</b> · et + les = <b>te les</b> · em + ho = <b>m'ho</b> · et + en = <b>te'n</b> (davant de vocal: <b>te n'</b>).</p><p>ens/us: <b>ens el</b>, <b>us la</b>, <b>ens ho</b>, <b>us en</b>.</p>",forms:["te'l","t'ho","me'n","me n'","te les","me'ls","us la","us en","ens la","te'n"],keys:["em","et","ens","us"]},{id:"comb-li",title:"Li + el, la, ho, en",short:"li + el = l'hi (o li'l) · li + la = la hi (o li la) · li + ho = li ho (o l'hi) · li + en = li'n",body:"<p>Ja <b>l'hi</b> he donat (el llibre a ella) · <b>La hi</b> he enviada · <b>Li  hi ha retard?",["Per la boira","Per una vaga","Per un problema tècnic"],"Per la boira","«A causa de la boira…»."),le("Quant de retard hi ha?",["Uns quaranta minuts","Unes dues hores","Vint minuts"],"Uns quaranta minuts","«…un retard aproximat de quaranta minuts»."),le("Què es pot portar a cabina?",["Una maleta de mà i un objecte personal","Dues maletes de mà","Només un objecte personal"],"Una maleta de mà i un objecte personal","És el que diu l'avís.")]},{id:"l2",title:"Notícia: el mercat de la Marina",kind:"Notícia de ràdio",text:"L'Ajuntament d'Eivissa ha anunciat que el mercat de la Marina tancarà durant tres mesos per fer-hi obres de rehabilitació. Les parades es traslladaran provisionalment a la plaça del Parc, on s'instal·larà una carpa amb capacitat per a vint comerciants. Segons la regidora de Comerç, l'objectiu és millorar l'accessibilitat de l'edifici i instal·lar plaques solars a la coberta. Alguns venedors, però, temen perdre clients durant l'estiu i demanen que les obres es facin a l'hivern. L'Ajuntament ha respost que el calendari depèn de les ajudes europees i que no es pot modificar.",items:[le("Quant de temps tancarà el mercat?",["Tres mesos","Tot l'estiu","Un any"],"Tres mesos","«…tancarà durant tres mesos»."),le("On aniran les parades?",["A una carpa a la plaça del Parc","A un altre mercat","Al port"],"A una carpa a la plaça del Parc","«…es traslladaran provisionalment a la plaça del Parc»."),le("Què volen alguns venedors?",["Que les obres es facin a l'hivern","Que no es facin obres","Més parades a la carpa"],"Que les obres es facin a l'hivern","Temen perdre clients a l'estiu."),le("Per què no es pot canviar el calendari?",["Depèn de les ajudes europees","Ja s'han començat les obres","La regidora no vol"],"Depèn de les ajudes europees","És la resposta de l'Ajuntament.")]},{id:"l3",title:"Entrevista a una biòloga marina",kind:"Entrevista",text:"— Per què és tan important la posidònia? — Perquè és el pulmó del nostre mar. Una sola hectàrea de posidònia produeix més oxigen que una hectàrea de bosc, i a més fixa la sorra i evita que les platges desapareguin. — Quin és el principal perill? — Sens dubte, les àncores. Quan una embarcació ancora damunt la praderia, arrenca plantes que han trigat segles a créixer. — I què pot fer un turista? — Informar-se abans de sortir a navegar. Hi ha aplicacions que indiquen on es pot ancorar sense fer malbé el fons, i també boies ecològiques gratuïtes.",items:[le("Per què diu que la posidònia és el pulmó del mar?",["Produeix molt d'oxigen","Filtra els plàstics","Hi viuen molts peixos"],"Produeix molt d'oxigen","«…produeix més oxigen que una hectàrea de bosc»."),le("Quin altre benefici té?",["Evita que les platges desapareguin","Fa l'aigua més calenta","Atreu turistes"],"Evita que les platges desapareguin","«…fixa la sorra i evita que les platges desapareguin»."),le("Quin és el principal perill?",["Les àncores","La pesca","Els banyistes"],"Les àncores","«Sens dubte, les àncores»."),le("Què recomana als turistes?",["Informar-se abans de navegar","No banyar-se a l'estiu","Llogar barques petites"],"Informar-se abans de navegar","Hi ha aplicacions i boies ecològiques.")]},{id:"l4",title:"Missatge al contestador",kind:"Missatge personal",text:"Hola, Marta, soc en Toni, de l'acadèmia. Et truco per la classe de dijous: la professora està malalta i l'hem hagut de passar a divendres a la mateixa hora, de sis a vuit. Si no hi pots venir, avisa'ns abans de dimecres i et reservarem plaça al grup de dissabte al matí. Ah, i recorda que has de portar la redacció que vau començar dimarts. Qualsevol cosa, truca'm al mòbil. Fins aviat!",items:[le("Per què es canvia la classe?",["La professora està malalta","És festiu","Hi ha obres a l'acadèmia"],"La professora està malalta","«…la professora està malalta»."),le("Quan serà la classe?",["Divendres de sis a vuit","Dijous de sis a vuit","Dissabte al matí"],"Divendres de sis a vuit","«…l'hem hagut de passar a divendres a la mateixa hora»."),le("Què ha de fer la Marta si no hi pot anar?",["Avisar abans de dimecres","Anar-hi dijous","Enviar un correu a la professora"],"Avisar abans de dimecres","Així li reservaran plaça dissabte."),le("Què ha de portar?",["La redacció començada dimarts","El llibre de text","Un certificat"],"La redacció començada dimarts","«…has de portar la redacció que vau començar dimarts».")]},{id:"l5",title:"Opinió: la setmana de quatre dies",kind:"Tertúlia",text:"Jo no estic en contra de la setmana de quatre dies, però crec que no es pot aplicar igual a tots els sectors. En una oficina potser funciona: hi ha estudis que diuen que la gent és més productiva i que s'agafen menys baixes. Ara bé, en l'hostaleria, que és el motor de la nostra economia, seria molt difícil. Qui atendria els clients el divendres? Caldria contractar més personal, i moltes empreses petites no s'ho poden permetre. Per això proposo començar amb proves pilot voluntàries i avaluar-ne els resultats abans de fer cap llei.",items:[le("Quina és la postura de la persona que parla?",["A favor amb matisos","Totalment en contra","Totalment a favor"],"A favor amb matisos","«No estic en contra…, però…»."),le("On creu que seria difícil d'aplicar?",["A l'hostaleria","A les oficines","A l'Administració"],"A l'hostaleria","«…en l'hostaleria… seria molt difícil»."),le("Quin problema esmenta per a les empreses petites?",["No poden contractar més personal","No tenen oficines","Tenen massa baixes"],"No poden contractar més personal","«…moltes empreses petites no s'ho poden permetre»."),le("Què proposa?",["Proves pilot voluntàries","Una llei immediata","Prohibir-la"],"Proves pilot voluntàries","«…proposo començar amb proves pilot voluntàries».")]},{id:"l6",title:"Instruccions: inscripció a la prova",kind:"Informació administrativa",text:"Per inscriure-vos a les proves de certificació de català heu d'emplenar el formulari en línia dins el termini establert a la convocatòria. Necessitareu el document d'identitat i, si sou funcionaris o teniu discapacitat, la documentació que ho acrediti per sol·licitar l'exempció de taxes. Una vegada fet el pagament, rebreu un correu de confirmació. Les llistes provisionals d'admesos es publicaran al web i tindreu deu dies hàbils per presentar-hi reclamacions. El dia de la prova heu de dur el document d'identitat original i un bolígraf blau o negre.",items:[le("Com es fa la inscripció?",["Amb un formulari en línia","Presencialment a l'escola","Per telèfon"],"Amb un formulari en línia","«…emplenar el formulari en línia»."),le("Qui pot demanar l'exempció de taxes?",["Funcionaris i persones amb discapacitat (acreditant-ho)","Tothom","Només els estudiants"],"Funcionaris i persones amb discapacitat (acreditant-ho)","Cal la documentació que ho acrediti."),le("Quant de temps hi ha per reclamar?",["Deu dies hàbils","Un mes","Quinze dies naturals"],"Deu dies hàbils","«…deu dies hàbils per presentar-hi reclamacions»."),le("Què cal portar el dia de la prova?",["El document d'identitat original i un bolígraf blau o negre","Una fotocòpia del DNI i un llapis","El justificant de pagament imprès"],"El document d'identitat original i un bolígraf blau o negre","És el que indiquen les instruccions.")]},{id:"l7",title:"Reportatge: tornar a viure al camp",kind:"Reportatge",text:"Fa cinc anys, la Neus i el seu company van deixar la feina a Barcelona i van venir a viure a una casa pagesa de Sant Mateu. Ara cultiven verdura ecològica i la venen per encàrrec a una cinquantena de famílies. Reconeixen que els inicis van ser durs: la casa no tenia aigua corrent i el primer hivern van haver de viure amb una estufa de llenya. Però diuen que no tornarien enrere. El que més valoren és el temps: abans passaven dues hores al dia al cotxe i ara poden dinar cada dia amb la seva filla. L'any que ve volen obrir un petit obrador per fer conserves.",items:[le("D'on venien la Neus i el seu company?",["De Barcelona","De Palma","De València"],"De Barcelona","«…van deixar la feina a Barcelona»."),le("A què es dediquen ara?",["A cultivar i vendre verdura ecològica","A llogar habitacions","A fer conserves"],"A cultivar i vendre verdura ecològica","Les conserves són un projecte de futur."),le("Quina dificultat van tenir al principi?",["La casa no tenia aigua corrent","No trobaven clients","No sabien català"],"La casa no tenia aigua corrent","«…la casa no tenia aigua corrent»."),le("Què és el que més valoren?",["Tenir més temps","Guanyar més diners","Viure a prop de la platja"],"Tenir més temps","«El que més valoren és el temps».")]},{id:"l8",title:"Conferència: llegir en paper o en pantalla",kind:"Conferència",text:"Durant molt de temps vam pensar que llegir en paper o en pantalla era el mateix. Tanmateix, les investigacions dels darrers anys indiquen que, quan es tracta de textos llargs i complexos, comprenem millor el que llegim en paper. Una de les explicacions és que a la pantalla tendim a llegir més de pressa i en diagonal, buscant paraules clau. Això no vol dir que hàgim de renunciar a la tecnologia, sinó que hem d'aprendre a llegir-hi amb calma. Els experts recomanen, per exemple, desactivar les notificacions i fer pauses per resumir mentalment el que acabem de llegir.",items:[le("Què indiquen les investigacions?",["Els textos llargs s'entenen millor en paper","Es llegeix més ràpid en paper","No hi ha cap diferència"],"Els textos llargs s'entenen millor en paper","«…comprenem millor el que llegim en paper»."),le("Per què es comprèn pitjor en pantalla?",["Llegim més de pressa i en diagonal","La lletra és més petita","Ens cansem la vista"],"Llegim més de pressa i en diagonal","És l'explicació que dona."),le("Què conclou la persona que parla?",["Cal aprendre a llegir amb calma en pantalla","Cal abandonar les pantalles","Només s'ha de llegir en paper"],"Cal aprendre a llegir amb calma en pantalla","«…no vol dir que hàgim de renunciar a la tecnologia, sinó…»."),le("Quin consell dona?",["Desactivar les notificacions","Llegir de nit","Fer servir tauletes grans"],"Desactivar les notificacions","També fer pauses per resumir.")]},{id:"l9",title:"Previsió del temps",kind:"Ràdio",text:"Bon dia. Per avui, a les Pitiüses, el cel estarà ennuvolat durant el matí i no es descarten ruixats dèbils a l'interior d'Eivissa. A partir del migdia, el vent de tramuntana anirà netejant el cel i la tarda serà assolellada. Les temperatures baixaran lleugerament: les màximes no passaran dels disset graus i les mínimes rondaran els nou. La mar estarà maregassa al nord, amb onades de fins a dos metres, de manera que es recomana precaució a les embarcacions petites. Per al cap de setmana, temps estable i més calor.",items:[le("Com serà el matí?",["Ennuvolat amb possibles ruixats","Assolellat","Amb neu"],"Ennuvolat amb possibles ruixats","«…ennuvolat durant el matí i no es descarten ruixats»."),le("Què passarà a la tarda?",["El cel s'aclarirà","Plourà més","Hi haurà boira"],"El cel s'aclarirà","La tramuntana netejarà el cel."),le("Quina serà la temperatura màxima?",["Uns disset graus","Uns nou graus","Uns vint-i-cinc graus"],"Uns disset graus","Nou graus és la mínima."),le("Què es recomana?",["Precaució a les embarcacions petites","No sortir de casa","Anar a la platja"],"Precaució a les embarcacions petites","Per les onades al nord.")]},{id:"l10",title:"A la farmàcia",kind:"Diàleg",text:"— Bon dia. Tenen alguna cosa per al mal de coll? — Sí, és clar. Té febre o tos? — Una mica de tos, sobretot a la nit, però febre no. — D'acord. Li puc donar aquestes pastilles per xuclar: en pot prendre una cada quatre hores, però no més de sis al dia. Si d'aquí a tres dies no millora, hauria d'anar al metge. — Molt bé. I per a la tos? — Prengui aquest xarop abans d'anar a dormir. Són dotze euros amb quaranta en total. — Puc pagar amb targeta? — I tant.",items:[le("Què li passa a la clienta?",["Té mal de coll i una mica de tos","Té febre alta","Té mal d'esquena"],"Té mal de coll i una mica de tos","No té febre."),le("Cada quant pot prendre les pastilles?",["Cada quatre hores","Cada sis hores","Una vegada al dia"],"Cada quatre hores","I no més de sis al dia."),le("Quan ha d'anar al metge?",["Si en tres dies no millora","Immediatament","Si li puja la febre demà"],"Si en tres dies no millora","És el consell de la farmacèutica."),le("Quan s'ha de prendre el xarop?",["Abans d'anar a dormir","Després de dinar","En llevar-se"],"Abans d'anar a dormir","«…abans d'anar a dormir».")]},{id:"l11",title:"Anunci: curs de cuina eivissenca",kind:"Anunci",text:"Vols aprendre a fer el sofrit pagès, la borrida de ratjada o el flaó com ho feien les nostres àvies? L'Escola d'Hostaleria organitza un curs de cuina tradicional eivissenca els dimecres de vuit a deu del vespre, del quinze de gener al dinou de març. El curs té un preu de cent vint euros, ingredients inclosos, i les places són limitades a quinze persones. Els aturats i els majors de seixanta-cinc anys tenen un descompte del cinquanta per cent. Inscripcions al web de l'escola o per telèfon fins al deu de gener.",items:[le("Quin dia de la setmana és el curs?",["Dimecres","Dilluns","Dissabte"],"Dimecres","«…els dimecres de vuit a deu del vespre»."),le("Què inclou el preu?",["Els ingredients","El sopar","Un llibre de receptes"],"Els ingredients","«…cent vint euros, ingredients inclosos»."),le("Quantes places hi ha?",["Quinze","Cinquanta","Vint"],"Quinze","Places limitades a quinze persones."),le("Qui té descompte?",["Aturats i majors de 65 anys","Estudiants","Tothom que s'inscrigui aviat"],"Aturats i majors de 65 anys","Un 50 % de descompte.")]},{id:"l12",title:"Entrevista: una mestra jubilada",kind:"Entrevista",text:"— Quants anys va fer de mestra? — Quaranta-dos, sempre a la mateixa escola de Sant Joan. Vaig començar quan encara hi havia una sola aula per a nens de totes les edats. — Què ha canviat més? — Sens dubte, la diversitat. Ara a una classe hi pot haver alumnes de deu països diferents, i això és una riquesa, però també un repte. — I què troba a faltar? — El contacte amb els nens, la seva curiositat. Encara hi vaig un dia a la setmana a llegir contes als més petits. — Quin consell donaria als mestres joves? — Que escoltin molt i que no perdin mai la paciència: cada nen té el seu ritme.",items:[le("Quants anys va treballar de mestra?",["Quaranta-dos","Vint-i-quatre","Trenta-dos"],"Quaranta-dos","«Quaranta-dos, sempre a la mateixa escola»."),le("Què diu que ha canviat més?",["La diversitat de l'alumnat","Els horaris","Els llibres"],"La diversitat de l'alumnat","Alumnes de molts països."),le("Què fa ara un dia a la setmana?",["Llegeix contes als petits","Fa classes de repàs","Treballa a la biblioteca"],"Llegeix contes als petits","«…a llegir contes als més petits»."),le("Quin consell dona?",["Escoltar molt i tenir paciència","Ser molt exigent","Fer servir més tecnologia"],"Escoltar molt i tenir paciència","Cada nen té el seu ritme.")]},{id:"l13",title:"Notícia: nou carril bici",kind:"Notícia",text:"El Consell d'Eivissa ha inaugurat aquest dissabte el nou carril bici que uneix Vila amb Sant Jordi. El recorregut té set quilòmetres i passa pel costat de ses Salines, cosa que permetrà als ciclistes gaudir del paisatge sense compartir la carretera amb els cotxes. Les obres han costat un milió i mig d'euros i s'han finançat en part amb fons europeus. Les associacions de ciclistes celebren la iniciativa, però recorden que encara falten aparcaments per a bicicletes a la ciutat i demanen que el carril s'allargui fins a l'aeroport.",items:[le("Quins llocs uneix el carril?",["Vila i Sant Jordi","Vila i Santa Eulària","Sant Antoni i l'aeroport"],"Vila i Sant Jordi","Ho diu al principi."),le("Quant fa el recorregut?",["Set quilòmetres","Setze quilòmetres","Un quilòmetre i mig"],"Set quilòmetres","«El recorregut té set quilòmetres»."),le("Com s'han finançat les obres?",["En part amb fons europeus","Només amb diners del Consell","Amb donacions"],"En part amb fons europeus","«…en part amb fons europeus»."),le("Què demanen els ciclistes?",["Allargar-lo fins a l'aeroport i més aparcaments","Tancar la carretera","Fer-lo de pagament"],"Allargar-lo fins a l'aeroport i més aparcaments","És el que reclamen.")]},{id:"l14",title:"Missatge de la tutora",kind:"Missatge",text:"Bona tarda, famílies. Us escric per recordar-vos que dijous que ve farem la sortida al Museu Puget. Els alumnes han de ser a l'escola a les vuit i mitja, perquè l'autobús surt a les nou en punt. Cal que portin l'esmorzar, aigua i roba còmoda. Tornarem cap a la una i mitja. Si algú té alguna al·lèrgia alimentària o necessita prendre algun medicament, digueu-m'ho abans de dimarts. Recordeu també que l'autorització signada és imprescindible: sense autorització, l'alumne s'haurà de quedar a l'escola amb un altre grup. Moltes gràcies.",items:[le("A quina hora han de ser a l'escola?",["A les vuit i mitja","A les nou en punt","A la una i mitja"],"A les vuit i mitja","L'autobús surt a les nou."),le("Què han de portar els alumnes?",["Esmorzar, aigua i roba còmoda","Diners per a l'entrada","Una llibreta"],"Esmorzar, aigua i roba còmoda","Ho diu el missatge."),le("Què cal comunicar abans de dimarts?",["Al·lèrgies o medicaments","Si l'alumne no hi va","El telèfon dels pares"],"Al·lèrgies o medicaments","«…digueu-m'ho abans de dimarts»."),le("Què passa si no porten l'autorització?",["Es queden a l'escola amb un altre grup","No passa res","Han de pagar més"],"Es queden a l'escola amb un altre grup","L'autorització és imprescindible.")]}],uS=["L'any passat vaig començar a estudiar català a l'escola d'adults.","La infermera em va dir que l'anàlisi estaria a punt dimecres.","Hem d'organitzar una reunió per parlar del pressupost.","Aquesta il·lusió no la perdré mai, encara que sigui difícil.","Els veïns es queixen del soroll que fan les obres del carrer.","Tanmateix, la majoria de les persones enquestades no hi està d'acord.","El col·legi ha organitzat una exposició sobre la història de l'illa.","Si tingués més temps, faria un curs d'informàtica.","No crec que el govern aprovi la llei abans de l'estiu.","Vaig rebre la teva sol·licitud ahir a la tarda.","Els joves fan servir les xarxes socials per informar-se.","A l'hivern, les platges d'Eivissa estan gairebé buides.","Me'n vaig a casa perquè ja és molt tard.","El metge m'ha receptat unes pastilles per al mal de cap.","Hi ha massa cotxes aparcats davant de l'escola.","Malgrat la pluja, l'excursió es va fer igualment.","La conferència començarà a les set en punt a la sala gran.","Cal que tothom porti el document d'identitat original.","Els aqüífers de l'illa es troben en una situació delicada.","Vull que m'expliquis com has aconseguit aprovar l'examen.","La pel·lícula està ambientada a l'Eivissa dels anys seixanta.","El professorat reclama una reducció de les ràtios.","Atès que no hi ha quòrum, la reunió s'ajorna fins dijous.","És imprescindible que protegim la posidònia de les àncores.","En definitiva, l'educació és una responsabilitat compartida."],Ut="Quina és correcta?",Ca=[{id:"f1",n:1,title:"Els nombres",goal:"Comptar de 0 a un milió i escriure bé els guionets i el femení (dues, dues-centes).",cards:[{title:"El truc D-U-C",html:"<p>Tres lletres per muntar qualsevol nombre, com fan els nens:</p><p><b>D-U</b> = <b>D</b>esena + <b>U</b>nitat: <b>trenta-dos</b> (30 + 2), <b>quaranta-cinc</b>. Només amb vint s'afegeix <b>-i-</b>: <b>vint-i-u</b>.</p><p><b>U-C</b> = <b>U</b>nitat + <b>C</b>entena: primer el multiplicador i després <b>-cents</b>: <b>dos-cents</b> (2 · cent), <b>tres-cents</b>, <b>set-cents</b>. Es llegeix en l'ordre en què s'escriu.</p><p>Junts, de gran a petit: <b>235 = dos-cents · trenta-cinc</b> (U-C + D-U). Els milers igual: <b>3.480 = tres mil · quatre-cents · vuitanta</b>.</p><p>Compte: <b>cent</b> (100) no porta «un», <b>mil</b> tampoc, però <b>dos mil</b>, <b>dos-cents</b>. Femení: <b>dues-centes</b>, <b>dues mil</b> persones.</p>"},{title:"De 0 a 20",html:"<p>zero · u (un, una) · <b>dos, dues</b> · tres · quatre · cinc · sis · set · vuit · nou · deu · onze · dotze · tretze · catorze · quinze · setze · disset · divuit · dinou · vint</p><p>A les Balears també es diu <b>desset, devuit, denou</b>: són correctes.</p>"},{title:"Desenes: el guionet",html:"<p>Desena + unitat amb guionet: <b>trenta-dos</b>, <b>quaranta-cinc</b>. Només amb vint hi ha <b>-i-</b>: <b>vint-i-u</b>, <b>vint-i-tres</b>.</p><p>trenta · quaranta · cinquanta · seixanta · setanta · vuitanta · <b>noranta</b></p>"},{title:"Centenars i milers",html:"<p>cent · cent u · <b>dos-cents</b> (masculí) / <b>dues-centes</b> (femení) · tres-cents · cinc-cents · mil (mai «un mil») · dos mil · un milió.</p><p>Concorden amb el nom: <b>dues-centes persones</b>, <b>dos-cents euros</b>.</p>"}],vocab:[{ca:"u, un, una",es:"uno, un, una"},{ca:"dos, dues",es:"dos (m./f.)"},{ca:"quatre",es:"cuatro"},{ca:"cinc",es:"cinco"},{ca:"set",es:"siete"},{ca:"vuit",es:"ocho"},{ca:"nou",es:"nueve"},{ca:"quinze",es:"quince"},{ca:"disset",es:"diecisiete",note:"balear: desset"},{ca:"divuit",es:"dieciocho",note:"balear: devuit"},{ca:"dinou",es:"diecinueve",note:"balear: denou"},{ca:"vint-i-tres",es:"veintitrés"},{ca:"trenta-quatre",es:"treinta y cuatro"},{ca:"seixanta",es:"sesenta"},{ca:"noranta",es:"noventa"},{ca:"dos-cents, dues-centes",es:"doscientos, doscientas"},{ca:"cinc-cents",es:"quinientos"},{ca:"mil",es:"mil"},{ca:"un milió",es:"un millón"}],items:[{type:"choice",q:"Com s'escriu 17?",options:["disset","dicisset","dieciset"],answer:"disset",e:"Disset (a les Balears, desset)."},{type:"choice",q:"Com s'escriu 23?",options:["vint-i-tres","vint i tres","vinti-tres"],answer:"vint-i-tres",e:"Amb vint: vint-i-tres, amb dos guionets."},{type:"choice",q:"Com s'escriu 34?",options:["trenta-quatre","trenta-i-quatre","trentaquatre"],answer:"trenta-quatre",e:"Desena + unitat amb un guionet (la -i- només amb vint)."},{type:"choice",q:"200 cadires",options:["dues-centes cadires","dos-cents cadires","dues-cents cadires"],answer:"dues-centes cadires",e:"Cadira és femení: dues-centes."},{type:"choice",q:"2 persones",options:["dues persones","dos persones"],answer:"dues persones",e:"Femení: dues."},{type:"choice",q:"Com s'escriu 90?",options:["noranta","novanta","nonanta"],answer:"noranta",e:"Noranta."},{type:"choice",q:"Com s'escriu 70?",options:["setanta","setenta","setanta-i"],answer:"setanta",e:"Setanta."},{type:"choice",q:"Com s'escriu 1.500?",options:["mil cinc-cents","un mil cinc-cents","mil cincents"],answer:"mil cinc-cents",e:"Mai «un mil»; cinc-cents amb guionet."},{type:"choice",q:"Com es diu 0?",options:["zero","cero","sero"],answer:"zero",e:"Zero."},{type:"choice",q:Ut,options:["Fa quinze anys.","Fa quinçe anys.","Fa quinse anys."],answer:"Fa quinze anys.",e:"Quinze, amb z."},{type:"choice",q:"Com s'escriu 300 (truc U-C)?",options:["tres-cents","trescents","cent tres"],answer:"tres-cents",e:"U-C: unitat + cents, amb guionet: tres-cents."},{type:"choice",q:"Com es diu 457?",options:["quatre-cents cinquanta-set","quatre-cents i cinquanta-set","quatre cents cinquanta set"],answer:"quatre-cents cinquanta-set",e:"U-C (quatre-cents) + D-U (cinquanta-set): sense -i- i amb guionets dins de cada bloc."},{type:"gap",q:"El llibre té ___ (326) pàgines.",answers:["tres-centes vint-i-sis"],e:"Pàgines és femení: tres-centes; D-U de vint: vint-i-sis."},{type:"gap",q:"Tinc ___ (2) germanes.",answers:["dues"],e:"Germanes és femení: dues."},{type:"gap",q:"A la classe hi ha ___ (21) alumnes.",answers:["vint-i-un"],e:"Davant de nom masculí: vint-i-un."},{type:"gap",q:"La sala té ___ (500) seients.",answers:["cinc-cents"],e:"Cinc-cents, amb guionet."},{type:"fix",q:"Corregeix: «Tinc dos filles.»",answers:["dues"],e:"Filles és femení: dues filles."}],dictation:["Tinc dues germanes i un germà.","La meva àvia té noranta-dos anys.","A la classe hi ha vint-i-tres alumnes.","El viatge costa dos-cents cinquanta euros.","Visc al número disset del carrer Major.","Hi van venir més de mil cinc-centes persones."]},{id:"f2",n:2,title:"Ordinals, dies, mesos i hores",goal:"Dir el primer, el cinquè…, les dates, els dies de la setmana i l'hora.",cards:[{title:"Ordinals",html:"<p><b>primer/primera</b> (1r, 1a) · <b>segon/segona</b> (2n, 2a) · <b>tercer/tercera</b> (3r, 3a) · <b>quart/quarta</b> (4t, 4a) · <b>cinquè/cinquena</b> (5è, 5a) · sisè · setè · vuitè · novè · desè.</p><p>Visc al <b>cinquè</b> pis, porta <b>segona</b>.</p>"},{title:"Dies, mesos i estacions",html:"<p>dilluns · dimarts · dimecres · dijous · divendres · dissabte · diumenge (en minúscula).</p><p>gener · febrer · <b>març</b> · abril · maig · juny · <b>juliol</b> · agost · setembre · octubre · novembre · desembre.</p><p>Dates: el 6 <b>de</b> març, el 2 <b>d'</b>octubre (de s'apostrofa davant de vocal). Estacions: primavera, estiu, <b>tardor</b>, hivern.</p>"},{title:"L'hora",html:"<p><b>És la una</b> · <b>Són les dues</b>, les tres… · Són les cinc <b>i quart</b> · les cinc <b>i mitja</b> · <b>tres quarts de</b> sis (5.45).</p><p>Tradicional: <b>un quart de</b> sis (5.15), <b>dos quarts de</b> sis (5.30).</p>"}],vocab:[{ca:"primer, primera",es:"primero, primera"},{ca:"segon, segona",es:"segundo, segunda"},{ca:"tercer, tercera",es:"tercero, tercera"},{ca:"quart, quarta",es:"cuarto, cuarta"},{ca:"cinquè, cinquena",es:"quinto, quinta"},{ca:"desè, desena",es:"décimo, décima"},{ca:"dilluns",es:"lunes"},{ca:"dimecres",es:"miércoles"},{ca:"dijous",es:"jueves"},{ca:"diumenge",es:"domingo"},{ca:"gener",es:"enero"},{ca:"març",es:"marzo"},{ca:"maig",es:"mayo"},{ca:"juliol",es:"julio"},{ca:"agost",es:"agosto"},{ca:"la tardor",es:"el otoño"},{ca:"l'hivern",es:"el invierno"},{ca:"És la una i mitja.",es:"Es la una y media."},{ca:"Són les set i quart.",es:"Son las siete y cuarto."}],items:[{type:"choice",q:"el 5è pis",options:["cinquè","quint","cinqué"],answer:"cinquè",e:"Cinquè, amb accent obert."},{type:"choice",q:"la 2a planta",options:["segona","secunda","segon"],answer:"segona",e:"Femení: segona."},{type:"choice",q:"el 4t",options:["quart","quatrè","cuart"],answer:"quart",e:"Quart, quarta."},{type:"choice",q:"Abreviatura de «tercera»",options:["3a","3ra","3è"],answer:"3a",e:"1a, 2a, 3a (femení); 1r, 2n, 3r, 4t (masculí)."},{type:"choice",q:"Data correcta",options:["el 2 d'octubre","el 2 de octubre","el 2 d'Octubre"],answer:"el 2 d'octubre",e:"D' davant de vocal i el mes en minúscula."},{type:"choice",q:"Completa: «Ens veiem ___.»",options:["dilluns","Dilluns","dillúns"],answer:"dilluns",e:"Els dies de la setmana van en minúscula."},{type:"choice",q:"El mes 7",options:["juliol","juli","julio"],answer:"juliol",e:"Juliol."},{type:"choice",q:"El mes 3",options:["març","mars","marzo"],answer:"març",e:"Març, amb ç."},{type:"choice",q:"L'estació de setembre a desembre",options:["tardor","otony","tardó"],answer:"tardor",e:"La tardor."},{type:"choice",q:"Després de dijous ve…",options:["divendres","dimecres","dissabte"],answer:"divendres",e:"Dijous → divendres → dissabte."},{type:"choice",q:"13.30",options:["És la una i mitja.","Són les una i mitja.","És les una i mitja."],answer:"És la una i mitja.",e:"Amb la una: és la una."},{type:"gap",q:"L'examen és el 6 ___ març.",answers:["de"],e:"De davant de consonant."},{type:"gap",q:"Vaig néixer el 15 ___ abril.",answers:["d'"],e:"D' davant de vocal: d'abril."},{type:"gap",q:"Visc al ___ (3r) pis.",answers:["tercer"],e:"Tercer."}],dictation:["L'examen és el sis de març.","El meu aniversari és el quinze d'agost.","Visc al cinquè pis, porta segona.","A la tardor plou més que a l'estiu.","Els dimarts i els dijous tinc classe de català.","Són les set i quart i encara no ha arribat."]},{id:"f3",n:3,title:"Colors i descripció",goal:"Descriure persones i coses amb el gènere i el nombre correctes.",cards:[{title:"Els colors concorden",html:"<p>blanc, <b>blanca</b>, blancs, <b>blanques</b> · negre, negra · vermell, vermella · <b>groc, groga, grocs, grogues</b> · verd, verda · <b>blau, blava, blaus, blaves</b> · <b>gris, grisa, grisos, grises</b>.</p>"},{title:"Colors que no canvien",html:"<p><b>marró</b> (marrons en plural) · <b>rosa</b> · <b>lila</b> · <b>taronja</b>: una camisa taronja, uns pantalons rosa.</p><p>Amb clar o fosc no concorden: uns ulls <b>blau fosc</b>.</p>"},{title:"Descriure",html:"<p>alt / baix · prim / gros · jove / gran · nou / vell · llarg / curt · simpàtic / antipàtic.</p><p>Té els cabells <b>negres</b> i els ulls <b>verds</b>.</p>"}],vocab:[{ca:"blanc, blanca",es:"blanco, blanca"},{ca:"negre, negra",es:"negro, negra"},{ca:"vermell, vermella",es:"rojo, roja"},{ca:"groc, groga",es:"amarillo, amarilla"},{ca:"grocs, grogues",es:"amarillos, amarillas"},{ca:"blau, blava",es:"azul"},{ca:"blaus, blaves",es:"azules"},{ca:"verd, verda",es:"verde"},{ca:"gris, grisa, grisos, grises",es:"gris, grises"},{ca:"marró, marrons",es:"marrón, marrones"},{ca:"taronja",es:"naranja (color)"},{ca:"alt, baix",es:"alto, bajo"},{ca:"prim, gros",es:"delgado, gordo"},{ca:"jove, gran",es:"joven, mayor"},{ca:"els cabells",es:"el pelo"},{ca:"els ulls",es:"los ojos"}],items:[{type:"choice",q:"una casa ___ (blanc)",options:["blanca","blanc","blanques"],answer:"blanca",e:"Femení singular: blanca."},{type:"choice",q:"les cadires ___ (groc)",options:["grogues","grocs","groques"],answer:"grogues",e:"Groc → groga → grogues (amb gu)."},{type:"choice",q:"uns ulls ___ (blau)",options:["blaus","blaves","blavos"],answer:"blaus",e:"Masculí plural: blaus."},{type:"choice",q:"les faldilles ___ (blau)",options:["blaves","blaues","blaus"],answer:"blaves",e:"Blau → blava → blaves."},{type:"choice",q:"els cotxes ___ (gris)",options:["grisos","grises","gris"],answer:"grisos",e:"Masculí plural: grisos."},{type:"choice",q:"unes sabates ___ (marró)",options:["marrons","marrones","marró"],answer:"marrons",e:"Marró no canvia de gènere; plural marrons."},{type:"choice",q:"una camisa ___ (taronja)",options:["taronja","taronjada","naranja"],answer:"taronja",e:"Taronja és invariable."},{type:"choice",q:"Com es diu «amarillo»?",options:["groc","amarill","gros"],answer:"groc",e:"Groc (gros vol dir gordo)."},{type:"choice",q:"la paret ___ (verd)",options:["verda","verd","verde"],answer:"verda",e:"Femení: verda."},{type:"choice",q:"El contrari d'«alt»",options:["baix","prim","curt"],answer:"baix",e:"Alt / baix."},{type:"choice",q:"El contrari de «nou»",options:["vell","jove","curt"],answer:"vell",e:"Nou / vell."},{type:"gap",q:"La senyera té quatre barres ___ (vermell) sobre fons groc.",answers:["vermelles"],e:"Barres és femení plural: vermelles."},{type:"fix",q:"Corregeix: «Té els ulls blaus foscos.»",answers:["blau fosc"],e:"Color + clar/fosc no concorda: ulls blau fosc."}],dictation:["La meva germana porta una jaqueta blava i unes sabates grogues.","Les cases d'Eivissa són blanques.","El cotxe gris és del veí del tercer.","Té els cabells negres i els ulls verds.","Les flors vermelles són per a la mare.","A l'estiu m'agraden els colors clars."]},{id:"f4",n:4,title:"Persones, família i feines",goal:"Parlar de la família i de les professions.",cards:[{title:"La família",html:"<p>pare · mare · <b>pares</b> (padres) · fill/filla · germà/germana · avi/<b>àvia</b> · oncle/tia (tiet/tieta) · cosí/cosina · <b>nebot/neboda</b> · <b>nét/néta</b>.</p><p>Per matrimoni: marit · dona · sogre/sogra · <b>gendre</b> (yerno) · <b>nora</b> (nuera) · cunyat/cunyada.</p>"},{title:"Feines",html:"<p>mestre/mestra · metge/<b>metgessa</b> · infermer/infermera · advocat/advocada · cambrer/cambrera · cuiner/cuinera · <b>pagès/pagesa</b> · funcionari/funcionària.</p><p>Treballa <b>de</b> mestra.</p>"}],vocab:[{ca:"els pares",es:"los padres"},{ca:"el germà, la germana",es:"el hermano, la hermana"},{ca:"l'avi, l'àvia",es:"el abuelo, la abuela"},{ca:"l'oncle, la tia",es:"el tío, la tía"},{ca:"el cosí, la cosina",es:"el primo, la prima"},{ca:"el nebot, la neboda",es:"el sobrino, la sobrina"},{ca:"el nét, la néta",es:"el nieto, la nieta"},{ca:"el sogre, la sogra",es:"el suegro, la suegra"},{ca:"el gendre",es:"el yerno"},{ca:"la nora",es:"la nuera"},{ca:"el cunyat, la cunyada",es:"el cuñado, la cuñada"},{ca:"el marit",es:"el marido"},{ca:"la metgessa",es:"la médica"},{ca:"el pagès, la pagesa",es:"el campesino, la campesina"},{ca:"el cambrer",es:"el camarero"}],items:[{type:"choice",q:"El fill del meu germà és el meu…",options:["nebot","cosí","nét"],answer:"nebot",e:"Nebot = sobrino."},{type:"choice",q:"La mare de la meva mare és la meva…",options:["àvia","tia","sogra"],answer:"àvia",e:"Àvia."},{type:"choice",q:"El fill del meu fill és el meu…",options:["nét","nebot","fillol"],answer:"nét",e:"Nét = nieto."},{type:"choice",q:"El germà del meu pare és el meu…",options:["oncle","cosí","cunyat"],answer:"oncle",e:"Oncle (o tiet)."},{type:"choice",q:"El marit de la meva filla és el meu…",options:["gendre","cunyat","sogre"],answer:"gendre",e:"Gendre = yerno."},{type:"choice",q:"La dona del meu fill és la meva…",options:["nora","cunyada","neboda"],answer:"nora",e:"Nora = nuera."},{type:"choice",q:"Ortografia",options:["àvia","avia","ávia"],answer:"àvia",e:"Àvia: accent obert."},{type:"choice",q:"Ortografia",options:["germà","germá","germa"],answer:"germà",e:"Aguda acabada en vocal: germà."},{type:"choice",q:"El femení de «metge»",options:["metgessa","metgia","metga"],answer:"metgessa",e:"Metgessa."},{type:"choice",q:"El femení de «pagès»",options:["pagesa","pagèssa","pagesia"],answer:"pagesa",e:"Pagès → pagesa (sense accent)."},{type:"choice",q:"Completa: «Ella treballa ___ mestra.»",options:["de","en","per"],answer:"de",e:"Treballar de + professió."},{type:"gap",q:"Els meus ___ (pare i mare) viuen a Sant Antoni.",answers:["pares"],e:"Pares = padres."},{type:"gap",q:"La germana de la meva mare és la meva ___.",answers:["tia","tieta"],e:"Tia o tieta."}],dictation:["La meva àvia té quatre néts i dues nétes.","El meu germà gran és metge a l'hospital.","Els meus pares viuen a Sant Antoni des de fa trenta anys.","La germana del meu pare és mestra.","El meu nebot petit té cinc anys.","La meva mare i jo anem al mercat cada dissabte."]},{id:"f5",n:5,title:"Verbs bàsics I: ser, estar, tenir, haver-hi",goal:"Conjugar en present els quatre verbs que surten a cada frase.",cards:[{title:"Ser i estar",html:"<p><b>ser:</b> soc, ets, és, som, sou, són · <b>estar:</b> estic, estàs, està, estem, esteu, estan.</p><p>Ser: qui ets, d'on ets, la teva feina (<b>Soc</b> mestra). Estar: com estàs ara (<b>Estic</b> cansada). Per preguntar on és una cosa: <b>On és</b> la farmàcia?</p><p>Des del 2017, <b>soc</b> s'escriu sense accent.</p>"},{title:"Tenir i haver-hi",html:"<p><b>tenir:</b> tinc, tens, <b>té</b>, tenim, teniu, tenen.</p><p><b>haver-hi:</b> sempre <b>hi ha</b> (mai «hi han»): hi ha molta gent, hi ha dos cotxes.</p><p>A les Balears: jo <b>som</b> (soc), jo <b>tenc</b> (tinc).</p>"}],vocab:[{ca:"jo soc",es:"yo soy"},{ca:"tu ets",es:"tú eres"},{ca:"ell és",es:"él es"},{ca:"nosaltres som",es:"nosotros somos"},{ca:"ells són",es:"ellos son"},{ca:"jo estic",es:"yo estoy"},{ca:"tu estàs",es:"tú estás"},{ca:"vosaltres esteu",es:"vosotros estáis"},{ca:"jo tinc",es:"yo tengo",note:"balear: tenc"},{ca:"tu tens",es:"tú tienes"},{ca:"ella té",es:"ella tiene"},{ca:"ells tenen",es:"ellos tienen"},{ca:"hi ha",es:"hay"},{ca:"Tinc trenta anys.",es:"Tengo treinta años."},{ca:"On és el banc?",es:"¿Dónde está el banco?"}],items:[{type:"choice",q:"Jo ___ de Vila.",options:["soc","sóc","sò"],answer:"soc",e:"Des del 2017: soc, sense accent."},{type:"choice",q:"Nosaltres ___ mestres.",options:["som","sem","són"],answer:"som",e:"Nosaltres som."},{type:"choice",q:"Ells ___ molt cansats.",options:["estan","estàn","estén"],answer:"estan",e:"Ells estan (sense accent)."},{type:"choice",q:"Tu ___ molta paciència.",options:["tens","tenes","tés"],answer:"tens",e:"Tu tens."},{type:"choice",q:"Ella ___ dos fills.",options:["té","te","tè"],answer:"té",e:"Té (verb) porta accent; te és pronom."},{type:"choice",q:"A la plaça ___ molta gent.",options:["hi ha","hi han","ha"],answer:"hi ha",e:"Sempre hi ha."},{type:"choice",q:Ut,options:["Tinc vint anys.","Soc vint anys.","Estic vint anys."],answer:"Tinc vint anys.",e:"L'edat amb tenir."},{type:"choice",q:"Jo ___ mestra d'escola.",options:["soc","estic","tinc"],answer:"soc",e:"Professió → ser."},{type:"gap",q:"Jo ___ (tenir) trenta-vuit anys.",answers:["tinc","tenc"],e:"Tinc (balear: tenc)."},{type:"gap",q:"Com ___ (estar, tu)?",answers:["estàs"],e:"Tu estàs."},{type:"gap",q:"La meva mare ___ (ser) de Formentera.",answers:["és"],e:"Ella és."},{type:"gap",q:"Vosaltres ___ (tenir) cotxe?",answers:["teniu"],e:"Vosaltres teniu."},{type:"fix",q:"Corregeix: «Hi han molts turistes a l'estiu.»",answers:["hi ha"],e:"Haver-hi sempre en singular: hi ha."}],dictation:["Soc de Vila, però visc a Santa Eulària.","Avui estic una mica cansada.","Tinc trenta-vuit anys i dos fills.","A la plaça hi ha molta gent.","Els meus amics són molt simpàtics.","On és la parada de l'autobús?"]},{id:"f6",n:6,title:"Verbs bàsics II: anar, fer, poder, voler…",goal:"Els verbs irregulars del dia a dia i el passat amb «vaig + infinitiu».",cards:[{title:"Present",html:"<p><b>anar:</b> vaig, vas, va, anem, aneu, van · <b>fer:</b> faig, fas, fa, fem, feu, fan · <b>poder:</b> puc, pots, pot, podem, podeu, poden · <b>voler:</b> vull, vols, vol, volem, voleu, volen.</p><p><b>saber:</b> sé, saps, sap, sabem, sabeu, saben · <b>venir:</b> vinc, vens, ve, venim, veniu, venen · <b>dir:</b> dic, dius, diu, diem, dieu, diuen.</p><p>A les Balears: anam, anau; feim, feis.</p>"},{title:"Obligació i passat",html:"<p>Obligació: <b>haver de</b>: he de, has de, ha de, hem de, heu de, han de (mai «tinc que»).</p><p>Passat: <b>vaig</b> + infinitiu: ahir <b>vaig anar</b> al metge, <b>vam fer</b> un pastís.</p>"}],vocab:[{ca:"jo vaig",es:"yo voy"},{ca:"nosaltres anem",es:"nosotros vamos",note:"balear: anam"},{ca:"jo faig",es:"yo hago"},{ca:"jo puc",es:"yo puedo"},{ca:"jo vull",es:"yo quiero"},{ca:"jo sé",es:"yo sé"},{ca:"jo vinc",es:"yo vengo"},{ca:"ells venen",es:"ellos vienen"},{ca:"jo dic",es:"yo digo"},{ca:"tu dius",es:"tú dices"},{ca:"he de treballar",es:"tengo que trabajar"},{ca:"vaig anar",es:"fui"},{ca:"vam fer",es:"hicimos"},{ca:"No ho sé.",es:"No lo sé."}],items:[{type:"choice",q:"Demà ___ a la platja (jo).",options:["vaig","vac","anem"],answer:"vaig",e:"Jo vaig."},{type:"choice",q:"Nosaltres ___ els deures.",options:["fem","femos","fan"],answer:"fem",e:"Nosaltres fem (balear: feim)."},{type:"choice",q:"Jo no ___ venir demà.",options:["puc","podo","pots"],answer:"puc",e:"Jo puc."},{type:"choice",q:"Jo ___ un cafè, si us plau.",options:["vull","volo","vol"],answer:"vull",e:"Jo vull."},{type:"choice",q:"Jo no ho ___.",options:["sé","se","sap"],answer:"sé",e:"Sé (saber) porta accent; se és pronom."},{type:"choice",q:"Ells ___ de Mallorca.",options:["venen","vénen","vinen"],answer:"venen",e:"Des del 2017: venen, sense accent."},{type:"choice",q:"Què ___ (tu)?",options:["dius","dieus","dicus"],answer:"dius",e:"Tu dius."},{type:"choice",q:"Obligació: «Demà ___ treballar.»",options:["he de","tinc que","deu de"],answer:"he de",e:"Haver de + infinitiu."},{type:"gap",q:"Ahir ___ (anar, jo, passat) al metge.",answers:["vaig anar"],e:"Passat perifràstic: vaig anar."},{type:"gap",q:"Ells no ___ (saber) on és.",answers:["saben"],e:"Ells saben."},{type:"gap",q:"Tu ___ (fer) esport?",answers:["fas"],e:"Tu fas."},{type:"fix",q:"Corregeix: «Tinc que estudiar més.»",answers:["he de"],e:"Mai «tinc que»: he de estudiar."},{type:"transform",q:"Passa a passat: «Faig un pastís.»",answers:["Vaig fer un pastís"],e:"Vaig + infinitiu."}],dictation:["Demà vaig a Palma amb el vaixell.","No puc venir perquè he de treballar.","Vull aprendre català per aprovar l'examen.","Què fas aquest cap de setmana?","No sé on he deixat les claus.","Ahir vaig anar al cinema amb la meva germana."]},{id:"f7",n:7,title:"Articles, possessius i demostratius",goal:"El, la, l', en; el meu, la meva; aquest, aquell, això.",cards:[{title:"Articles",html:"<p><b>el, la, els, les</b>. Davant de vocal o h: <b>l'</b>amic, <b>l'</b>hora (però <b>la</b> universitat, <b>la</b> història: i/u àtones).</p><p>Amb noms de person  a",use:"Introduir tema",example:"Pel que fa a l'horari, proposo canviar-lo."},{term:"Ara bé",use:"Matisar",example:"És una bona idea. Ara bé, s'ha d'estudiar."},{term:"En definitiva",use:"Concloure",example:"En definitiva, el català ens uneix."},{term:"Per acabar",use:"Tancar el text",example:"Per acabar, agraeixo la vostra atenció."}],TS=["El turisme a Eivissa: oportunitat o problema?","Hauríem de prohibir els mòbils a les escoles?","El preu de l'habitatge a les Illes: causes i solucions","Teletreball: avantatges i inconvenients","Quin paper té el català en la vida diària d'Eivissa?","Les xarxes socials ens acosten o ens aïllen?","Cal limitar els cotxes al centre de les ciutats?","Una festa tradicional que coneguis i què representa","Aprendre llengües de gran: dificultats i estratègies","El canvi climàtic a la Mediterrània"],NS=["El Consell d'Eivissa ha aprovat un pla per reduir el consum d'aigua durant l'estiu. Entre les mesures, destaquen la reutilització d'aigües depurades per al reg i les campanyes de sensibilització adreçades als establiments turístics.","Malgrat que la majoria de la població entén el català, el seu ús social continua sent desigual. Els experts coincideixen que l'escola és clau, però que no n'hi ha prou: cal que la llengua sigui present també en l'oci i en el món laboral.","L'Ajuntament recorda als veïns que el termini per presentar sol·licituds d'ajut per a la rehabilitació d'habitatges acaba el proper dia 30. Les persones interessades poden adreçar-se a l'Oficina d'Atenció a la Ciutadania."],OS={topics:TS,readings:NS},kS=[{id:"e0",label:"Gener 2020",note:"Prova + solucionari",pdf:"https://www.caib.es/webgoib/documents/81190/1448611/Prova+C1+%2B+solucionari.pdf/6c5ef752-893d-921e-652d-274c3df10c7c?t=1728965246291",audio1:"https://www.caib.es/webgoib/documents/81190/1448611/A%CC%80rea+1+exercici+1+C1+gener+2020+3m12s.mp3/e838fcea-9fe4-9f2f-622f-79804de3eb67?t=1728965271717",audio2:"https://www.caib.es/webgoib/documents/81190/1448611/A%CC%80rea+1+exercici+2+C1+gener+2020.mp3/7ea10a06-5b1e-7435-e59b-a7f7719168f2?t=1728965309697",reserved:!1},{id:"e1",label:"Gener 2021",note:"Prova completa",pdf:"https://www.caib.es/webgoib/documents/81190/1448611/C1_GEN21_COMPLETA.pdf/9ce0c4e8-082b-b6c4-12c8-be4e66d8bc70?t=1728965350455",audio1:"https://www.caib.es/webgoib/documents/81190/1448611/Exercici+1.+A%CC%80rea+1.+C1+gener+2021.mp3/997a249a-32f2-9b00-a884-dead23b05775?t=1728965388228",audio2:"https://www.caib.es/webgoib/documents/81190/1448611/Exercici+2.+A%CC%80rea+1.+C1+gener+2021.mp3/54ed3133-ce91-8c8f-7dbe-5b39f94ebdef?t=1728965430087",reserved:!1},{id:"e2",label:"Setembre 2021",note:"Prova",pdf:"https://www.caib.es/webgoib/documents/81190/1448611/C1_SET21.pdf/702b41d4-24ae-6eff-9646-462e4240d920?t=1728965474361",audio1:"https://www.caib.es/webgoib/documents/81190/1448611/Exercici+1+CO+C1+set21.mp3/740c2bfb-456a-98f7-2fe1-c6de29418db7?t=1728965508704",audio2:"https://www.caib.es/webgoib/documents/81190/1448611/Exercici+2+CO+C1+set21.mp3/552cc9f2-9d01-76b8-b78f-18eb67420e08?t=1728965555179",reserved:!1},{id:"e3",label:"Gener 2022",note:"Prova",pdf:"https://www.caib.es/webgoib/documents/81190/1448611/C1.+Gener+de+2022.pdf/b0333b40-ea16-b9bf-250d-1ff02c151a27?t=1728965637219",audio1:"https://www.caib.es/webgoib/documents/81190/1448611/A%CC%80udio+exercici+1_C1+gen2022.mp3/c69c9d21-b959-271f-86c1-f840ea288113?t=1728965669181",audio2:"https://www.caib.es/webgoib/documents/81190/1448611/A%CC%80udio+exercici+2_C1+gen2022.mp3/6e1ea096-1987-a22f-1c00-b7a1fa50e9e6?t=1728965703956",reserved:!1},{id:"e4",label:"Maig 2022",note:"Prova + solucionari",pdf:"https://www.caib.es/webgoib/documents/81190/1448611/C1+MAIG22_prova+i+solucionari.pdf/fd9a1237-f013-8193-2e5c-9386102d4c29?t=1728965745876",audio1:"https://www.caib.es/webgoib/documents/81190/1448611/A%CC%80udio+exercici+1_C1+gen2022+%281%29.mp3/36346737-90fe-a46a-7db7-b2c44a5122a0?t=1728966729517",audio2:"https://www.caib.es/webgoib/documents/81190/1448611/A%CC%80udio+exercici+2_C1+gen2022+%281%29.mp3/51677153-3dc8-89e4-1fe5-0dc341e48f7d?t=1728966764936",reserved:!1},{id:"e5",label:"Gener 2023",note:"Prova + solucionari",pdf:"https://www.caib.es/webgoib/documents/81190/1448611/GEN23+C1+Prova+i+solucionari.pdf/42eb5af5-6dd8-ad60-dd8e-a8fb9de44ea3?t=1728965823078",audio1:"https://www.caib.es/webgoib/documents/81190/1448611/Exercici+1+CO+C1+gener+2023.mp3/b2215ac3-092f-fac1-dc86-c8670c5b9a87?t=1728965853253",audio2:"https://www.caib.es/webgoib/documents/81190/1448611/Exercici+2+CO+C1+gener+2023.mp3/14b60268-0915-c956-aaf2-ab2fb0fec96a?t=1728965882456",reserved:!1},{id:"e6",label:"Maig 2023",note:"Prova + solucionari",pdf:"https://www.caib.es/webgoib/documents/81190/1448611/MAIG23+C1+Prova+i+solucionari.pdf/e2d6b9e7-731a-0787-d928-3516cd77ff2c?t=1728965921779",audio1:"https://www.caib.es/webgoib/documents/81190/1448611/a%CC%80udio+1_C1+Maig+2023.mp3/8231ed52-644f-3951-0c05-34c2c1ca1832?t=1728965961566",audio2:"https://www.caib.es/webgoib/documents/81190/1448611/a%CC%80udio+2_C1+Maig+2023.mp3/572128a0-611c-b22c-9d09-60b9ccdd8b50?t=1728965991521",reserved:!1},{id:"e7",label:"Gener 2024",note:"Prova + solucionari",pdf:"https://www.caib.es/webgoib/documents/81190/1448611/GEN24+C1+Prova+i+solucionari.pdf/062ea5ad-df5b-af76-a41f-e258343d9715?t=1728966053872",audio1:"https://www.caib.es/webgoib/documents/81190/1448611/C1+A%CC%80udio+exercici+1+gener+24.mp3/23dfdc1d-96c7-b812-9aa4-8c6192b16b65?t=1728966085696",audio2:"https://www.caib.es/webgoib/documents/81190/1448611/C1+A%CC%80udio+exercici+2+gener+24.mp3/06483a04-219c-4c38-7a25-f1b2cc0b790e?t=1728966133184",reserved:!1},{id:"e8",label:"Maig 2024",note:"Prova + solucionari",pdf:"https://www.caib.es/webgoib/documents/81190/1448611/MAIG24+C1+Prova+i+solucionari.pdf/3c876261-8fc2-2614-c6aa-67a0e9838b31?t=1728966171480",audio1:"https://www.caib.es/webgoib/documents/81190/1448611/Ex.+1.+A%CC%80rea+1.+C1+MAIG24.mp3/80ea3662-5c68-a0ac-933b-acd29aed7843?t=1728966207078",audio2:"https://www.caib.es/webgoib/documents/81190/1448611/Ex.+2.+A%CC%80rea+1.+C1+MAIG24.wav/7f499d06-87a2-8935-6535-18e11fdaf45e?t=1728966248559",reserved:!1},{id:"e9",label:"Gener 2025",note:"Reservat per a simulacre",pdf:"https://www.caib.es/webgoib/documents/81190/2109688/Prova+C1+GENER+2025+%281%29.pdf/e30ceaab-42eb-5c66-fd52-55d384ffdb42?t=1738843041573",audio1:"https://www.caib.es/webgoib/documents/81190/2109688/Exercici+1.+C1_gener+2025+%281%29.mp3/e391bc42-1320-9b9d-d694-42d2c00b9e19?t=1738843093290",audio2:"https://www.caib.es/webgoib/documents/81190/2109688/Exercici+2_C1_gener+2025+%281%29.mp3/448025e3-eacd-e457-f9e4-abcb761f14d9?t=1738843115151",reserved:!0},{id:"e10",label:"Maig 2025",note:"Reservat per a simulacre",pdf:"https://www.caib.es/webgoib/documents/81190/1506618/PROVA+C1.+MAIG25+%281%29.pdf/13ffd09a-c871-6f93-b7dc-f23254be5976?t=1750331970729",audio1:"https://www.caib.es/webgoib/documents/81190/1506618/C1.+CO+Exercici+1+MAIG25+%281%29.wav/f3775f7c-fc75-a579-039a-97341a7dfc78?t=1750332036015",audio2:"https://www.caib.es/webgoib/documents/81190/1506618/C1.+CO+Exercici+2+MAIG25+%281%29.mp3/0d6d6df4-7fe3-88f8-b660-2ad6249869cf?t=1750332068195",reserved:!0},{id:"e11",label:"Gener 2026",note:"Reservat per a simulacre",pdf:"https://www.caib.es/webgoib/documents/81190/1506618/GENER26_C1_Prova+completa.pdf/6f1dffb8-63fd-fa3e-c479-7a90cd5c80ea?t=1771501166630",audio1:"https://www.caib.es/webgoib/documents/81190/1506618/Exercici+1_C1_GEN26.mp3/102662b6-2a0d-04e6-21cc-b69d7b7fa1e9?t=1771501209388",audio2:"https://www.caib.es/webgoib/documents/81190/1506618/Exercici+2_C1_GEN26.mp3/681ed444-b489-a183-7334-c701128dab24?t=1771501231674",reserved:!0},{id:"e12",label:"Maig 2026",note:"Reservat per a simulacre",pdf:"https://www.caib.es/webgoib/documents/81190/1506618/MAIG26_C1_Prova+completa.pdf/c63cb47b-9dc9-f732-cb94-3d5be01d456b?t=1784097013045",audio1:"https://www.caib.es/webgoib/documents/81190/1506618/MAIG26_C1_Exercici_1.mp3/0e94ee02-b125-b8c5-7055-b40d68172e00?t=1784097044732",audio2:"https://www.caib.es/webgoib/documents/81190/1506618/MAIG26_C1_Exercici_2.mp3/69320673-175b-e350-2711-06a92ddb89e4?t=1784097059415",reserved:!0}],RS=[{id:"p1",area:"Gramàtica",title:"Pronoms febles: directe o indirecte?",html:"<p>El <b>complement directe</b> rep l'acció: <b>el, la, els, les</b>. L'<b>indirecte</b> és qui la rep (a qui?): <b>li</b> (singular) i <b>els</b> (plural).</p><p>He vist <u>la Maria</u> → <b>l'</b>he vista. He escrit <u>a la Maria</u> → <b>li</b> he escrit.</p><p>Truc: <i>dir, escriure, telefonar, agradar</i> porten indirecte (li): «Li agrada», «Digue-li».</p>",example:"Li he dit que l'esperaré a la porta."},{id:"p2",area:"Gramàtica",title:"En i hi, sense por",html:"<p><b>En</b> substitueix complements amb <b>de</b> i quantitats: «Parlem del viatge» → <b>en</b> parlem. «Vols pa?» → Sí, <b>en</b> vull.</p><p><b>Hi</b> substitueix llocs i complements amb <b>a, en, amb</b>: «Vaig al cinema» → <b>hi</b> vaig. «Penso en tu» → <b>hi</b> penso.</p><p>Davant vocal: <b>n'</b>hem parlat; darrere: parla<b>'n</b>, ves-<b>hi</b>.</p>",example:"No en sé res, però hi pensaré."},{id:"p3",area:"Gramàtica",title:"Combinacions de pronoms",html:"<p>Quan van junts, l'indirecte va primer: <b>me'l</b>, <b>te la</b>, <b>se'ls</b>.</p><p><b>Li + el/la/els/les</b> → forma general <b>l'hi, la hi, els hi, les hi</b> («El llibre, l'hi he donat»). En registre formal també: li'l, li la.</p><p><b>Li + ho</b> → <b>li ho</b>: «Li ho he explicat».</p><p>Darrere del verb: dona-<b>me'l</b>, explica-<b>li-ho</b>.</p>",example:"Dona-me'l ara mateix, que li ho he promès."},{id:"p4",area:"Gramàtica",title:"Per o per a?",html:"<p>Davant d'un <b>nom</b>: <b>per a</b> indica destinació o finalitat («un regal <b>per a</b> tu»); <b>per</b> indica causa, mitjà, lloc o temps («<b>per</b> la pluja», «<b>per</b> correu», «<b>per</b> Nadal»).</p><p>Davant d'un <b>infinitiu</b>, <b>per</b> sempre és correcte: «He vingut <b>per</b> parlar-te».</p>",example:"Aquest informe és per a la directora; l'he enviat per correu."},{id:"p5",area:"Gramàtica",title:"La preposició que cau",html:"<p>Moltes preposicions <b>desapareixen davant de «que»</b> i de l'infinitiu: «Estic content <b>de</b> la notícia» però «Estic content <b>que</b> vinguis».</p><p>Incorrecte: <s>de que</s>, <s>en que</s> conjuncions. Correcte: «Confio <b>que</b> ho entendràs».</p><p>Amb relatiu sí que es manté, i porta accent: «El tema <b>de què</b> parlàvem».</p>",example:"Confio que ho entendràs i estic segura que aprovaràs."},{id:"p6",area:"Lèxic",title:"12 barbarismes que resten punts",html:"<p><s>desde</s> → des de · <s>tenir que</s> → haver de / cal · <s>a nivell de</s> → quant a · <s>sin embargo</s> → tanmateix · <s>bueno</s> → bé · <s>vale</s> → d'acord · <s>apretar</s> → prémer · <s>buzón</s> → bústia · <s>plaç</s> → termini · <s>llevar a cap</s> → dur a terme · <s>ademés</s> → a més · <s>entonces</s> → aleshores.</p>",example:"Hem de dur a terme el projecte dins del termini."},{id:"p7",area:"Lèxic",title:"Gènere: les trampes",html:"<p>Diferents del castellà: <b>el senyal, el dubte, el costum, el corrent, el front, el pendent, l'avantatge</b> (masculins).</p><p><b>la dent, l'anàlisi, la síndrome, la resta</b> (femenins).</p><p>Pista: si dubtes, busca'l al DIEC abans de l'examen.</p>",example:"El dubte que tinc és sobre l'anàlisi de sang."},{id:"p8",area:"Ortografia",title:"Accents: la regla en 30 segons",html:"<p>Porten accent les <b>agudes</b> acabades en vocal, <b>-as -es -is -os -us</b>, <b>-en -in</b> (cafè, francès, també); les <b>planes</b> que <b>no</b> acaben així (fàcil, càrrec); i <b>totes les esdrúixoles</b> (música).</p><p>Diacrítics (des del 2017 només 15): bé, déu, és, mà, més, món, pèl, què, sé, sí, sòl, són, té, ús, vós. <b>Ja no</b>: soc, dona, adeu, net.</p>",example:"És fàcil: també, càrrec i música porten accent."},{id:"p9",area:"Ortografia",title:"L'apòstrof",html:"<p>L'article <b>el, la</b> s'apostrofa davant vocal o h: <b>l'</b>home, <b>l'</b>illa.</p><p>Excepcions femenines: davant <b>i/u àtones</b> no: <b>la</b> universitat, <b>la</b> història, <b>la</b> idea. Tampoc davant <b>ui</b>: la iaia.</p><p><b>De</b> també: <b>d'</b>Eivissa, <b>d'</b>hora.</p>",example:"La universitat d'Eivissa obre l'escola d'estiu."},{id:"p10",area:"Gramàtica",title:"Quan cal subjuntiu",html:"<p>Després de <b>cal que, tant de bo, abans que, perquè</b> (finalitat), <b>quan</b> (futur), <b>potser</b> (dubte): «Quan <b>vinguis</b>, avisa'm», «Cal que ho <b>facis</b>».</p><p>Formes clau: faci, sigui, tingui, pugui, vulgui, sàpiga, vingui.</p>",example:"Cal que vinguis abans que tanquin, perquè puguis parlar amb ella."},{id:"p11",area:"Gramàtica",title:"Relatius: que, què, qui, on",html:"<p><b>que</b> sense preposició: «El llibre <b>que</b> llegeixo».</p><p>Amb preposició: <b>què</b> per a coses («el tema <b>de què</b> parlàvem»), <b>qui</b> per a persones («la noia <b>amb qui</b> treballo»), <b>on</b> per a llocs. Formal: <b>el qual, la qual</b>.</p>",example:"La companya amb qui treballo viu a la ciutat on vaig néixer."},{id:"p12",area:"Redacció",title:"La carta formal",html:"<p><b>Encapçalament:</b> Benvolgut senyor, / Benvolguda senyora, / Senyors,</p><p><b>Obertura:</b> Us escric per… · Em adreço a vostès per…</p><p><b>Petició:</b> Per tot això, sol·licito… · Us agrairia que…</p><p><b>Comiat:</b> Atentament, / Cordialment, + nom i data.</p><p>Tracte: <b>vostè</b> o <b>vós</b>, però el mateix en tot el text.</p>",example:"Benvolguda senyora, us escric per sol·licitar informació sobre el termini d'inscripció. Atentament."},{id:"p13",area:"Redacció",title:"Estructura que aprova",html:"<p><b>1.</b> Introducció: situa el tema i la teva tesi (2-3 frases).<br><b>2.</b> Desenvolupament: 2 paràgrafs, un argument i un exemple cadascun.<br><b>3.</b> Contraargument: «Ara bé, hi ha qui pensa…».<br><b>4.</b> Conclusió: reprèn la tesi i tanca.</p><p>Compta les paraules: 170 (ex. 1) i 250 (ex. 2). Quedar-se curt penalitza.</p>",example:"En definitiva, crec que cal trobar un equilibri entre turisme i qualitat de vida."},{id:"p14",area:"Redacció",title:"Com et corregeixen",html:"<p>El GOIB valora cinc aspectes: <b>adequació</b> (registre i tipus de text), <b>coherència</b> (idees ordenades, sense repeticions), <b>cohesió</b> (connectors i puntuació), <b>repertori</b> (lèxic ric i precís) i <b>correcció</b> (ortografia i gramàtica).</p><p>Cal un 60 % de l'àrea. Un text curt i correcte puntua més que un text llarg ple d'errors.</p>",example:""},{id:"p15",area:"Oral",title:"Guanya temps a l'oral",html:"<p>Frases per pensar sense quedar-te en blanc: «És una qüestió interessant…», «Deixa'm pensar-ho un moment», «Com deia abans…», «Dit d'una altra manera…».</p><p>Per opinar: «Al meu parer», «Des del meu punt de vista», «Estic d'acord en part, però…».</p>",example:"És una qüestió interessant. Al meu parer, cal trobar-hi un equilibri."},{id:"p16",area:"Oral",title:"La lectura en veu alta",html:"<p>Val 20 punts. Llegeix-la un cop mentalment abans de començar. Vigila:</p><p>• les <b>vocals neutres</b> (a/e àtones) i les <b>o/u</b> àtones;<br>• la <b>essa sonora</b> (casa, zero) i la <b>sorda</b> (cassa, cel);<br>• les pauses a les comes i els punts.</p><p>Millor a poc a poc i clar que ràpid i amb errors.</p>",example:"La casa del costat té una cassola de zinc."},{id:"p17",area:"Varietat",title:"Les formes balears a l'examen",html:"<p>Al GOIB pots fer servir formes balears normatives, com <b>jo cant, jo dorm</b> o <b>que jo canti</b>, però sigues <b>coherent</b> en tot el text.</p><p>L'<b>article salat</b> (es, sa) és col·loquial: evita'l a l'escrit formal i en l'exposició oral.</p>",example:""},{id:"p18",area:"Estratègia",title:"Àrea 2: com no perdre punts",html:"<p>30 preguntes en 40 minuts: poc més d'un minut cadascuna.</p><p><b>1.</b> Fes primer les que saps segur. <b>2.</b> Marca els dubtes i torna-hi al final. <b>3.</b> No deixis cap resposta en blanc si no resta punts. <b>4.</b> Desconfia de la forma que «sona» com el castellà.</p>",example:""}],LS=[{id:"w1",title:"Correu a l'EOI demanant informació",words:170,minutes:40,exercise:"Àrea 3 · exercici 1",brief:"Vols matricular-te a un curs intensiu de català a l'Escola Oficial d'Idiomes d'Eivissa. Escriu un correu formal per demanar informació sobre horaris, preu i requisits, i explica per què t'interessa."},{id:"w2",title:"Convocatòria d'una reunió de veïns",words:170,minutes:40,exercise:"Àrea 3 · exercici 1",brief:"Ets el president de la comunitat de veïns. Redacta una convocatòria per a una reunió extraordinària sobre les obres de la façana: data, hora, lloc, ordre del dia (3 punts) i instruccions per delegar el vot."},{id:"w3",title:"Acta d'una reunió",words:170,minutes:40,exercise:"Àrea 3 · exercici 1",brief:"Redacta l'acta de la reunió del claustre on s'ha decidit organitzar una setmana cultural: assistents, ordre del dia, acords presos i hora de cloenda."},{id:"w4",title:"Opinió: limitar l'arribada de turistes",words:250,minutes:60,exercise:"Àrea 3 · exercici 2",brief:"El Consell d'Eivissa estudia limitar el nombre de vehicles i places turístiques a l'estiu. Escriu un article d'opinió per al diari local: posiciona't amb arguments i exemples i respon un contraargument."},{id:"w5",title:"Opinió a partir d'una notícia: mòbils a l'aula",words:250,minutes:60,exercise:"Àrea 3 · exercici 2",brief:"Notícia: «El Govern prohibeix l'ús del mòbil a les aules de Primària i ESO». Escriu un article d'opinió que valori la mesura, amb un títol, una introducció, dos arguments i una conclusió."},{id:"w6",title:"Carta al director: habitatge",words:250,minutes:60,exercise:"Àrea 3 · exercici 2",brief:"Escriu una carta al director d'un diari sobre la dificultat dels joves per trobar habitatge a les Illes. Exposa el problema, les causes i proposa solucions."}],DS=[{id:"inter",title:"Interacció d'examen",subtitle:"Àrea 4 · exercici 2 · arribeu a un acord",brief:"Fes de company/a d'examen a la prova oral C1 del GOIB (exercici d'interacció). Situació: heu de decidir junts com gastar 3.000 € que l'associació de veïns ha rebut per millorar el barri d'Eivissa. Defensa una opció diferent de la de l'alumne, negocia i, al final, arribeu a un acord."},{id:"feina",title:"Entrevista de feina",subtitle:"Registre formal",brief:"Fes d'entrevistador/a de recursos humans d'un hotel d'Eivissa que busca un/a responsable de recepció. Fes preguntes una a una i reacciona a les respostes."},{id:"ajunt",title:"A l'Ajuntament",subtitle:"Fer una reclamació oral",brief:"Fes de funcionari/ària d'atenció ciutadana de l'Ajuntament d'Eivissa. L'alumne ve a fer una reclamació sobre el soroll al seu carrer. Demana dades, explica el procediment i posa algun petit obstacle realista."},{id:"lliure",title:"Conversa lliure",subtitle:"Actualitat, cultura, opinió",brief:"Fes de conversador/a culte/a i amable. Proposa un tema d'actualitat de les Illes Balears i debat-lo amb l'alumne, fent preguntes que l'obliguin a argumentar."}],MS=[{prompt:"___ he dit mil vegades: no hi vull anar.",options:["T'ho","Te l'","Te ho"]},{prompt:"Has vist la Maria? Sí, ___ vista aquest matí.",options:["la he","l'he","li he"]},{prompt:"Pensa ___ portar el paraigua, que plourà.",options:["en","a","de"]},{prompt:"Quina és correcta?",options:["Tenim que acabar.","Hem d'acabar.","Tenim d'acabar."]},{prompt:"On deixes les cartes?",options:["Al buzó","A la bústia","Al bussó"]},{prompt:"Cal que ho ___ abans de divendres.",options:["fassis","fesis","facis"]},{prompt:"___ que vaig arribar, no ha parat de ploure.",options:["Desde","Des","Dès"]},{prompt:"La companya ___ et vaig parlar arriba demà.",options:["que","de qui","de la que"]},{prompt:"Vas anar a la reunió? Sí, ___ vaig anar.",options:["hi","en","la"]},{prompt:"Vols pa? Sí, ___ vull una mica.",options:["en","el","hi"]},{prompt:"Demà comencen les classes a ___.",options:["l'universitat","la universitat","le universitat"]},{prompt:"Aquest regal és ___ tu.",options:["per","per a","pera"]},{prompt:"«Ploure sobre mullat» vol dir:",optio
