ugmenta bruscament","es manté estable","disminueix lleugerament"],answer:"augmenta bruscament",e:"Pujada sobtada: augmenta bruscament, es dispara."},{type:"choice",q:"Descriure un gràfic: el valor no canvia",options:["es manté estable","es dispara","cau en picat"],answer:"es manté estable",e:"Sense canvis: es manté estable."},{type:"choice",q:"Tria la forma correcta: «El consum ___ un 20 %.»",options:["ha augmentat","ha aumentat","ha incrementat-se"],answer:"ha augmentat",e:"Augmentar, amb g. Incrementar no és pronominal."},{type:"choice",q:"Quin connector introdueix una conseqüència?",options:["per tant","malgrat que","en canvi"],answer:"per tant",e:"Per tant, així doncs, en conseqüència."},{type:"choice",q:"Quin connector introdueix una causa?",options:["ja que","tanmateix","a més"],answer:"ja que",e:"Ja que, perquè, atès que."},{type:"fix",q:"Corregeix l'expressió incorrecta: «Han reduït els residus degut a la campanya.»",answers:["a causa de","gràcies a"],e:"«Degut a» no és correcte per expressar causa: a causa de, gràcies a."},{type:"fix",q:"Corregeix: «El medio ambient ens preocupa.»",answers:["medi"],e:"Medi ambient (sense o)."},{type:"choice",q:"Lèxic: residus que es poden tornar a fer servir",options:["reciclables","renovables","contaminants"],answer:"reciclables",e:"Renovable es diu de l'energia."},{type:"choice",q:"Lèxic: energia que no s'esgota (solar, eòlica…)",options:["renovable","fòssil","nuclear"],answer:"renovable",e:"Energia renovable o neta."},{type:"transform",q:"Uneix amb com més … més: «Si hi ha més cotxes, hi ha més contaminació.»",answers:["Com més cotxes hi ha, més contaminació hi ha"],e:"Com més + nom/verb…, més…"},{type:"choice",q:"Completa: «El 2023 es van registrar ___ turistes que mai.»",options:["més","tants","tan"],answer:"més",e:"Més … que mai."},{type:"gap",q:"Treballo ___ (per a + una) ONG ecologista.",answers:["per a una"],e:"Treballar per a algú o una entitat → per a."},{type:"choice",q:"Quina frase descriu bé el gràfic sense er  de ara","desde ara"],answer:"a partir d'ara",e:"De davant de vocal s'apostrofa; «desde» és castellà."},{type:"choice",q:"Registre: quina frase és pròpia d'una notícia?",options:["L'Ajuntament d'Eivissa ha aprovat aquest dimarts el pressupost.","Bueno, l'Ajuntament ja ha aprovat el pressupost.","Saps que l'Ajuntament ha aprovat el pressupost?"],answer:"L'Ajuntament d'Eivissa ha aprovat aquest dimarts el pressupost.",e:"Notícia: informació objectiva, registre formal, qui i quan al principi."},{type:"choice",q:"Verb d'atribució neutre i formal",options:["ha declarat","ha xerrat","ha deixat anar"],answer:"ha declarat",e:"Declarar, afirmar, explicar, assegurar."},{type:"choice",q:"Una notícia ha de respondre a…",options:["qui, què, quan, on, com i per què","només què i qui","l'opinió del periodista"],answer:"qui, què, quan, on, com i per què",e:"Les sis preguntes bàsiques."},{type:"choice",q:"Titular adequat",options:["Eivissa limita l'entrada de cotxes a l'estiu","Per fi! Ja no hi haurà cotxes","El Consell ha decidit coses sobre els cotxes"],answer:"Eivissa limita l'entrada de cotxes a l'estiu",e:"Breu, informatiu, en present i sense opinió."},{type:"fix",q:"Corregeix: «Els veïns estan d'acord a la proposta.»",answers:["amb"],e:"Estar d'acord amb alguna cosa."},{type:"fix",q:"Corregeix l'expressió incorrecta: «La decisió es prendrà en base a l'informe.»",answers:["segons","d'acord amb","sobre la base de","a partir de"],e:"«En base a» no és correcte: segons, d'acord amb, a partir de."},{type:"transform",q:"Elimina la preposició sobrera: «La policia ha detingut a dos homes.»",answers:["La policia ha detingut dos homes"],e:"El complement directe de persona no porta a (llevat de casos d'ambigüitat)."},{type:"fix",q:"Corregeix: «Avui a la tarde hi haurà un ple.»",answers:["tarda"],e:"Tarde és castellà: tarda (o capvespre)."},{type:"fix",q:"Corregeix: «El ple es celebrarà el próxim dijous.»",answers:["pròxim","proper"],e:"Pròxim amb accent obert (o proper)."},{type:"transform",q:"Passa a estil indirecte: La consellera ha dit: «Construirem dues escoles.»",answers:["La consellera ha dit que construiran dues escoles"],e:"Primera persona → tercera: construiran."},{type:"transform",q:"Passa a estil indirecte en passat: L'alcalde va dir: «Ho farem aquest any.»",answers:["L'alcalde va dir que ho farien aquell any"],e:"Futur → condicional (farien) i aquest → aquell."},{type:"choice",q:"Registre formal: «Els veïns estan ___ amb les obres.»",options:["descontents","emprenyats","cabrejats"],answer:"descontents",e:"Emprenyat i cabrejat són col·loquials."},{type:"choice",q:Ri,options:["dilluns passat","el passat dilluns"],answer:"dilluns passat",e:"En català l'adjectiu va darrere: dilluns passat, la setmana passada."},{type:"choice",q:"Ortografia: quina és correcta?",options:["es van produir","es van produïr","es van producir"],answer:"es van produir",e:"Els infinitius en -ir no porten dièresi: produir (però produït)."},{type:"choice",q:"Ortografia: quina és correcta?",options:["pressupost","presupost","pressupòst"],answer:"pressupost",e:"Pressupost amb ss."},{type:"choice",q:"Barbarisme: quina és la forma correcta?",options:["tenir en compte","tenir en cuenta","tenir a compte"],answer:"tenir en compte",e:"Tenir en compte."},{type:"choice",q:"Ortografia: quina és correcta?",options:["ple municipal","pleno municipal","plè municipal"],answer:"ple municipal",e:"El ple (sense accent)."},{type:"choice",q:"Entradeta adequada per a una notícia",options:["El Consell d'Eivissa ha aprovat avui un pla per reduir el trànsit a l'estiu.","Fa molt de temps que es parla del trànsit.","Jo crec que el trànsit és un problema."],answer:"El Consell d'Eivissa ha aprovat avui un pla per reduir el trànsit a l'estiu.",e:"L'entradeta resumeix el fet principal: qui, què i quan."},{type:"choice",q:"Atribució correcta",options:["Segons la policia, no hi ha ferits.","Segons la policia, no hi han ferits.","Segons a la policia, no hi ha ferits."],answer:"Segons la policia, no hi ha ferits.",e:"Segons sense a; hi ha sempre en singular."}]},Bx="Quina frase és correcta?",uq={lessons:["p10"],pretest:[{type:"choice",q:"Vull que ___ a la reunió.",options:["vinguis","véns","vindràs"],answer:"vinguis",e:"Voler que + subjuntiu quan els subjectes són diferents."},{type:"choice",q:"Quan ___ a casa, truca'm.",options:["arribis","arribaràs","arribes"],answer:"arribis",e:"Quan amb valor de futur → subjuntiu."},{type:"choice",q:"Si ___ temps, aprendria a programar.",options:["tingués","tindria","tinc"],answer:"tingués",e:"Hipòtesi: si + imperfet de subjuntiu + condicional."},{type:"choice",q:"No crec que la tecnologia ___ la solució.",options:["sigui","és","serà"],answer:"sigui",e:"Opinió negada → subjuntiu."},{type:"choice",q:"Crec que la tecnologia ___ útil.",options:["és","sigui","fos"],answer:"és",e:"Opinió afirmativa → indicatiu."}],model:{title:"Mòbils a l'aula: prohibir o educar?",genre:"Article d'opinió (Àrea 3, exercici 2 · 250 paraules)",text:`Fa uns mesos que es debat si s'han de prohibir els telèfons mòbils als centres educatius. Algunes comunitats ja ho han fet i n'hi ha que demanen que la mesura s'estengui a totes les etapes. Al meu parer, prohibir-los pot ser útil a primària, però a secundària seria més eficaç que els alumnes aprenguessin a fer-ne un ús responsable.

En primer lloc, és evident que el mòbil distreu. Diversos estudis indiquen que els alumnes que el tenen a sobre es concentren menys, encara que no el facin servir. Per tant, és lògic que els centres en limitin l'ús durant les classes.

Ara bé, no crec que la prohibició total sigui la solució. Els adolescents passaran moltes hores davant d'una pantalla al llarg de la seva vida i necessiten que algú els ensenyi a protegir les seves dades, a contrastar informacions i a desconnectar. Si l'escola renuncia a aquesta tasca, qui se n'encarregarà?

Hi ha qui argumenta que les famílies són les responsables d'aquesta educació. Tanmateix, no totes tenen els coneixements ni el temps necessaris, i l'escola ha de garantir la igualtat d'oportunitats.

En definitiva, caldria que les normes fossin clares i que anessin acompanyades de formació. Si els joves entenguessin per què han de desar el mòbil, segurament ho farien de més bon grat. Prohibir és fàcil; educar és més difícil, però també més necessari.`,notes:[{quote:"Al meu parer",note:"Fórmula formal per presentar l'opinió (també: des del meu punt de vista, considero que)."},{quote:"seria més eficaç que els alumnes aprenguessin",note:"Condicional + que + imperfet de subjuntiu."},{quote:"encara que no el facin servir",note:"Concessiva amb subjuntiu."},{quote:"és lògic que els centres en limitin l'ús",note:"Expressió valorativa + que + subjuntiu. En = del mòbil."},{quote:"no crec que la prohibició total sigui",note:"Opinió negada → subjuntiu."},{quote:"Ara bé",note:"Connector de contrast que obre la teva tesi."},{quote:"necessiten que algú els ensenyi",note:"Necessitar que + subjuntiu."},{quote:"Hi ha qui argumenta que",note:"Introdueix el contraargument per rebatre'l."},{quote:"Tanmateix",note:"Refuta el contraargument."},{quote:"caldria que les normes fossin clares",note:"Caldria que + imperfet de subjuntiu: proposta."},{quote:"Si els joves entenguessin",note:"Hipòtesi: si + imperfet de subjuntiu … farien."}]},examples:[{ca:"Vull que m'expliquis com funciona l'aplicació.",note:"Voler que + subjuntiu (subjectes diferents)."},{ca:"Vull aprendre a programar.",note:"Mateix subjecte → infinitiu, no subjuntiu."},{ca:"Quan tinguis un moment, mira el correu.",note:"Quan amb valor de futur → subjuntiu."},{ca:"No crec que la intel·ligència artificial substitueixi els mestres.",note:"Opinió negada → subjuntiu."},{ca:"Crec que la tecnologia pot ajudar a aprendre.",note:"Opinió afirmativa → indicatiu."},{ca:"És imprescindible que protegim les nostres dades.",note:"Expressió impersonal de necessitat + subjuntiu."},{ca:"Busquem algú que sàpiga programar.",note:"Antecedent desconegut → subjuntiu."},{ca:"T'ho envio perquè ho revisis.",note:"Perquè de finalitat → subjuntiu."},{ca:"Encara que la connexió sigui lenta, la reunió es farà.",note:"Concessiva hipotètica → subjuntiu."},{ca:"Si tingués més temps, faria un curs de disseny.",note:"Si + imperfet de subjuntiu + condicional."},{ca:"Si ho hagués sabut, t'hauria avisat.",note:"Hipòtesi en passat: si + plusquamperfet de subjuntiu + condicional perfet."},{ca:"Hauríem de limitar l'ús de pantalles abans de dormir.",note:"Condicional d'haver de per recomanar."},{ca:"M'agradaria que l'escola oferís formació digital.",note:"Condicional + que + imperfet de subjuntiu."}],practice:[{type:"choice",q:"Espero que ___ bé l'examen.",options:["et vagi","et va","t'anirà"],answer:"et vagi",e:"Esperar que + subjuntiu."},{type:"choice",q:"M'agradaria que ___ més temps per estudiar.",options:["tingués","tingui","tinc"],answer:"tingués",e:"Verb principal en condicional → imperfet de subjuntiu."},{type:"choice",q:"Dubto que ___ a temps.",options:["arribin","arriben","arribaran"],answer:"arribin",e:"Dubtar que + subjuntiu."},{type:"choice",q:"Sé que ___ a temps.",options:["arribaran","arribin","arribessin"],answer:"arribaran",e:"Saber que (certesa) + indicatiu."},{type:"choice",q:"Busco una aplicació que ___ en català.",options:["funcioni","funciona","funcionarà"],answer:"funcioni",e:"Encara no sé si existeix → subjuntiu."},{type:"choice",q:"Tinc una aplicació que ___ en català.",options:["funciona","funcioni"],answer:"funciona",e:"Antecedent conegut → indicatiu."},{type:"choice",q:"És important que els joves ___ un ús responsable del mòbil.",options:["facin","fan","faran"],answer:"facin",e:"És important que + subjuntiu."},{type:"choice",q:"T'ho explico perquè ho ___.",options:["entenguis","entens","entendràs"],answer:"entenguis",e:"Perquè de finalitat (= a fi que) → subjuntiu."},{type:"choice",q:"Abans que ___ fosc, tornarem.",options:["es faci","es fa","es farà"],answer:"es faci",e:"Abans que + subjuntiu."},{type:"choice",q:"Si ho hagués sabut, no ___ vingut.",options:["hauria","hagués","he"],answer:"hauria",e:"Si hagués + participi … hauria + participi."},{type:"choice",q:"Si demà fa sol, ___ a la platja.",options:["anirem","aniríem","anéssim"],answer:"anirem",e:"Condició possible: si + present … futur."},{type:"choice",q:Bx,options:["Si tingués diners, compraria un ordinador nou.","Si tindria diners, compraria un ordinador nou.","Si tindrà diners, compraria un ordinador nou."],answer:"Si tingués diners, compraria un ordinador nou.",e:"Mai condicional darrere de si: si tingués."},{type:"choice",q:"Tria la forma: «Hauries ___ apagar el mòbil a classe.»",options:["d'","de","que"],answer:"d'",e:"Haver de + infinitiu; davant de vocal: hauries d'apagar."},{type:"choice",q:"Condicional de cortesia: «___ ajudar-me amb aquest formulari?»",options:["Podria","Podrà","Pogués"],answer:"Podria",e:"El condicional suavitza la petició."},{type:"choice",q:"Article d'opinió: quina frase expressa l'opinió amb registre formal?",options:["Al meu parer, l'ús del mòbil a l'aula s'hauria de regular.","Jo flipo amb els mòbils a l'aula.","Els mòbils són una passada."],answer:"Al meu parer, l'ús del mòbil a l'aula s'hauria de regular.",e:"Fórmula d'opinió i lèxic neutre."},{type:"choice",q:"Quina frase introdueix bé un contraargument?",options:["Hi ha qui pensa que la prohibició és la millor opció; tanmateix…","Bueno, és igual el que pensin.","I punt."],answer:"Hi ha qui pensa que la prohibició és la millor opció; tanmateix…",e:"Presentes l'altra postura i la rebats."},{type:"choice",q:"Lèxic: forma correcta",options:["descarregar","descargar","desgarregar"],answer:"descarregar",e:"Descarregar o baixar un fitxer."},{type:"choice",q:"Lèxic: forma correcta",options:["contrasenya","contrasenia","contrasseña"],answer:"contrasenya",e:"Contrasenya."},{type:"choice",q:"Lèxic: forma correcta",options:["xarxes socials","redes socials","xarses socials"],answer:"xarxes socials",e:"Xarxa, amb x."},{type:"choice",q:"Lèxic: forma correcta",options:["ordinador","ordenador","computadora"],answer:"ordinador",e:"Ordinador."},{type:"gap",q:"Cal que tots ___ (fer, present de subjuntiu) un esforç.",answers:["fem"],e:"Fer: que jo faci, que nosaltres fem."},{type:"gap",q:"Volia que ___ (venir, tu, imperfet de subjuntiu) a la xerrada.",answers:["vinguessis","vinguesses"],e:"Venir: vingués, vinguessis."},{type:"gap",q:"És possible que ___ (ploure) aquesta tarda.",answers:["plogui"],e:"Ploure: que plogui."},{type:"gap",q:"Si ___ (poder, jo, imperfet de subjuntiu), treballaria des de casa.",answers:["pogués"],e:"Poder: pogués."},{type:"gap",q:"No penso que ___ (ser) una bona idea.",answers:["sigui"],e:"Opinió negada → subjuntiu: sigui."},{type:"gap",q:"Quan ___ (tenir, tu) els resultats, envia'ns-els.",answers:["tinguis"],e:"Quan + futur → subjuntiu: tinguis."},{type:"gap",q:"Els he demanat que no ___ (fer) soroll.",answers:["facin"],e:"Demanar que + subjuntiu."},{type:"gap",q:"Ens agradaria que l'ajuntament ___ (instal·lar) wifi gratuït.",answers:["instal·lés"],e:"Condicional + que + imperfet de subjuntiu."},{type:"fix",q:"Corregeix: «Si tindria temps, ho faria.»",answers:["tingués"],e:"Darrere de si no hi va mai condicional: si tingués."},{type:"fix",q:"Corregeix: «Quan arribaràs, avisa'm.»",answers:["arribis"],e:"Quan amb valor de futur → subjuntiu."},{type:"fix",q:"Corregeix: «Vull que véns a la reunió.»",answers:["vinguis"],e:"Voler que + subjuntiu."},{type:"fix",q:"Corregeix: «No crec que és necessari.»",answers:["sigui"],e:"Opinió negada → subjuntiu."},{type:"fix",q:"Corregeix: «Espero que tens sort.»",answers:["tinguis"],e:"Esperar que + subjuntiu."},{type:"transform",q:"Comença amb «Vull que»: «Tu estudies cada dia.»",answers:["Vull que estudiïs cada dia"],e:"Estudiar: que estudiï, que estudiïs (amb dièresi)."},{type:"transform",q:"Fes-ho hipotètic (si + imperfet de subjuntiu): «Si tinc temps, aniré al curs.»",answers:["Si tingués temps, aniria al curs"],e:"Hipòtesi: tingués … aniria."},{type:"transform",q:"Nega l'opinió: «Crec que és fàcil.»",answers:["No crec que sigui fàcil"],e:"En negar l'opinió, el verb passa a subjuntiu."},{type:"transform",q:"Uneix amb «perquè» de finalitat: «Et deixo el portàtil. Pots treballar.»",answers:["Et deixo el portàtil perquè puguis treballar"],e:"Finalitat → subjuntiu: puguis."},{type:"transform",q:"Passa al passat: «Si ho sé, t'ho dic.» (no ho sabia)",answers:["Si ho hagués sabut, t'ho hauria dit"],e:"Hipòtesi no realitzada en passat."},{type:"choice",q:"Tria la forma: «Encara que ___ molt, no em convenceràs.»",options:["insisteixis","insistiràs","insistiries"],answer:"insisteixis",e:"Concessiva hipotètica → subjuntiu."},{type:"choice",q:"Tria la forma: «Tan bon punt ___ la connexió, et truco.»",options:["tingui","tindré","tenia"],answer:"tingui",e:"Temporal amb valor de futur → subjuntiu."},{type:"choice",q:"Tria la forma: «Caldria que el govern ___ més en recerca.»",options:["invertís","inverteix","invertirà"],answer:"invertís",e:"Caldria que + imperfet de subjuntiu."}],skeleton:{brief:"Article d'opinió per al diari digital de l'illa: «La intel·ligència artificial a l'escola: amenaça o oportunitat?» (250 paraules).",template:`Darrerament s'ha obert el debat sobre ___. Al meu parer, ___.

En primer lloc, ___. Per exemple, ___.

A més a més, és important que ___ (subjuntiu).

Hi ha qui argumenta que ___. Tanmateix, no crec que ___ (subjuntiu), ja que ___.

En definitiva, caldria que ___ (imperfet de subjuntiu). Si ___ (si + imperfet de subjuntiu), ___ (condicional).`,tips:["Fes servir com a mínim tres subjuntius diferents (és important que, no crec que, caldria que).","Inclou una oració amb si + imperfet de subjuntiu + condicional.","Presenta i rebat un contraargument."]},oral:{reading:"Cada vegada més empreses ofereixen als treballadors el dret a desconnectar. Això vol dir que, fora de l'horari laboral, ningú no els pot exigir que responguin correus ni missatges. Els experts asseguren que aquesta mesura redueix l'estrès i millora la productivitat, tot i que encara hi ha sectors on és difícil d'aplicar.",topic:"Les xarxes socials: ens acosten o ens aïllen? Dona la teva opinió amb arguments i exemples.",phrases:["Des del meu punt de vista…","No crec que… (subjuntiu)","És evident que…","Si fos jo…","Caldria que…"],bot:"Fes de company/a de debat a la ràdio local. L'alumne defensa una postura sobre l'ús de les xarxes socials entre els adolescents i tu defenses la contrària. Fes-li preguntes que l'obliguin a fer servir el subjuntiu i hipòtesis (què faries si…?) i rebat els seus arguments amb educació."},exam:{brief:"El consell escolar del teu centre vol prohibir els mòbils també durant l'esbarjo. Escriu un article d'opinió per a la revista del centre en què donis la teva opinió, aportis dos arguments i rebatis un contraargument.",words:250,minutes:60,focus:["subjuntiu (voler que, no crec que, és important que)","oracions condicionals (si + imperfet de subjuntiu)","connectors d'opinió i de contrast"],checklist:["He presentat la meva opinió al principi","He desenvolupat dos arguments amb exemples","He rebatut un contraargument","He fet servir el subjuntiu almenys tres vegades","He inclòs una hipòtesi amb si","Té entre 230 i 270 paraules"]}},dq={lessons:["p3"],pretest:[{type:"choice",q:"Em deixes el llibre? — Sí, ___ deixo.",options:["te'l","et el","t'el"],answer:"te'l",e:"Et + el = te'l."},{type:"choice",q:"M'ho expliques? — Sí, ___ explico.",options:["t'ho","et ho","te ho"],answer:"t'ho",e:"Et + ho = t'ho."},{type:"choice",q:"Vols entrades? — Sí, compra-___ dues.",options:["me'n","m'en","me les"],answer:"me'n",e:"Em + en darrere del verb: compra-me'n."},{type:"choice",q:"Darrere del verb, quina és correcta?",options:["Dona-me'l.","Dona'm-el.","Dona-me-el."],answer:"Dona-me'l.",e:"Me + el = me'l: dona-me'l."},{type:"choice",q:"Te'n vas? — Sí, ___ vaig ara.",options:["me'n","m'en","me"],answer:"me'n",e:"Anar-se'n: me'n vaig."}],model:{title:"«La sal del vent»: Eivissa abans del turisme",genre:"Ressenya (Àrea 3, exercici 1 · 170-250 paraules) · obra inventada",text:`«La sal del vent», de la directora eivissenca Clara Marí, és una de les estrenes més esperades de la temporada. La pel·lícula està ambientada a l'Eivissa dels anys seixanta i narra la història de l'Antònia, una jove pagesa que veu com l'arribada del turisme transforma el seu poble.

El primer que crida l'atenció és la fotografia. Els paisatges de salines i camps d'ametllers estan filmats amb una llum tan càlida que l'espectador gairebé pot sentir l'olor de la sal. El repartiment, format majoritàriament per actors de les Illes, és un altre dels encerts: la protagonista transmet una barreja de curiositat i por que fa creïble cada escena.

Ara bé, la pel·lícula no és perfecta. Tot i que el ritme és àgil al principi, a la segona part decau i algunes trames secundàries queden sense resoldre. Hauria estat millor que el guió s'hagués centrat en el conflicte familiar, que és el més interessant.

Malgrat aquestes mancances, «La sal del vent» és una obra honesta que ens fa reflexionar sobre el preu del progrés. Si teniu ocasió de veure-la en versió original, no us la perdeu: els diàlegs en eivissenc li donen una autenticitat difícil de trobar. Jo ja l'he recomanada a tots els meus amics, i ara us la recomano a vosaltres.`,notes:[{quote:"està ambientada a",note:"Ressenya: on i quan passa l'obra."},{quote:"narra la història de",note:"Sinopsi breu, sense explicar el final."},{quote:"és un altre dels encerts",note:"Valoració positiva amb lèxic precís."},{quote:"Ara bé",note:"Canvi cap als aspectes negatius."},{quote:"Tot i que el ritme és àgil",note:"Valoració matisada amb concessiva."},{quote:"Hauria estat millor que el guió s'hagués centrat",note:"Crítica educada: condicional perfet + plusquamperfet de subjuntiu."},{quote:"Malgrat aquestes mancances",note:"Concessió amb nom per tancar la crítica."},{quote:"no us la perdeu",note:"Combinació us + la amb imperatiu negatiu."},{quote:"li donen una autenticitat",note:"Li: complement indirecte (a la pel·lícula)."},{quote:"Jo ja l'he recomanada",note:"Participi concordat amb el pronom la."},{quote:"us la recomano",note:"Us (a vosaltres) + la (la pel·lícula)."}]},examples:[{ca:"Me'l deixes un parell de dies?",note:"Em + el = me'l."},{ca:"T'ho explicaré demà amb calma.",note:"Et + ho = t'ho."},{ca:"Us en recomano dues de molt bones.",note:"Us + en: quantitat."},{ca:"Ens la van ensenyar al museu.",note:"Ens + la."},{ca:"Als organitzadors, els ho vaig dir el primer dia.",note:"Els (complement indirecte) + ho."},{ca:"A la directora, li ho he explicat (o l'hi he explicat).",note:"Li + ho: dues formes correctes."},{ca:"Dona-me'l, si us plau.",note:"Darrere de l'imperatiu: dona-me'l."},{ca:"Explica-m'ho sense pressa.",note:"Darrere de verb acabat en vocal: -m'ho."},{ca:"Porta'ns-en una mica.",note:"Porta + ens + en."},{ca:"Se n'ha anat sense dir res.",note:"Es + en = se n' davant de vocal."},{ca:"Del títol, no me'n recordo.",note:"Recordar-se de → me'n."},{ca:"L'exposició, us la recomano de tot cor.",note:"El complement avançat es repeteix amb un pronom."},{ca:"La pel·lícula està ambientada a l'Eivissa dels anys seixanta.",note:"Lèxic de la ressenya: ambientació."}],practice:[{type:"choice",q:"M'has portat les entrades? — Sí, ___ he portades.",options:["te les","t'les","et les"],answer:"te les",e:"Et + les = te les."},{type:"choice",q:"Ens expliques la pel·lícula? — Sí, ___ explico.",options:["us la","us l'","vos la"],answer:"us la",e:"Us + la davant de consonant: us la explico."},{type:"choice",q:"Has dit la veritat als teus pares? — Sí, ___ he dita.",options:["els l'","els la","les hi"],answer:"els l'",e:"Els (CI) + la (CD) davant de vocal: els l'he dita."},{type:"choice",q:"Em dones les claus? — Ara mateix ___ dono.",options:["te les","te'ls","et les"],answer:"te les",e:"Les claus: femení plural → te les."},{type:"choice",q:"Ens recomanes un museu? — Sí, ___ recomano un.",options:["us en","us n'","vos en"],answer:"us en",e:"Quantitat (un) → en: us en recomano un."},{type:"choice",q:"Li has dit que vindràs? — Sí, ___ he dit.",options:["li ho","l'ho","li l'"],answer:"li ho",e:"Li + ho = li ho (o l'hi)."},{type:"choice",q:"T'has adonat de l'error? — Sí, ___ he adonat.",options:["me n'","me'n","m'en"],answer:"me n'",e:"Me + en davant de vocal: me n'he adonat."},{type:"choice",q:"Darrere del verb, quina és correcta?",options:["Explica-m'ho.","Explica'm-ho.","Explica-me-ho."],answer:"Explica-m'ho.",e:"Verb acabat en vocal + em + ho = -m'ho."},{type:"choice",q:"Darrere del verb, quina és correcta?",options:["Porta'ns-el.","Porta-ns-el.","Porta'ns'l."],answer:"Porta'ns-el.",e:"Porta + ens = porta'ns; + el = porta'ns-el."},{type:"choice",q:"Darrere del verb, quina és correcta?",options:["Digues-li-ho.","Digues-l'ho.","Digues-li'ho."],answer:"Digues-li-ho.",e:"Li + ho darrere del verb: digues-li-ho (o digues-l'hi)."},{type:"choice",q:Bx,options:["Me l'han recomanada.","Me la han recomanada.","M'el han recomanat."],answer:"Me l'han recomanada.",e:"La s'apostrofa davant de vocal i el participi concorda: recomanada."},{type:"gap",q:"Les fotos? Envia-___ (a mi, les fotos) per correu.",answers:["me-les"],e:"Darrere del verb: envia-me-les."},{type:"gap",q:"El catàleg? Ja ___ (a ell, això) he enviat.",answers:["li ho","l'hi"],e:"Li + ho = li ho o l'hi."},{type:"gap",q:"Si vols entrades, ___ (a tu, en) puc aconseguir dues.",answers:["te'n"],e:"Et + en davant de consonant = te'n."},{type:"gap",q:"Aquesta cançó, ___ (a nosaltres, la cançó) cantava la meva àvia.",answers:["ens la"],e:"Ens + la."},{type:"gap",q:"Vull regalar-___ (a ella, el llibre).",answers:["li'l","l'hi"],e:"Li + el darrere d'infinitiu: regalar-li'l o regalar-l'hi."},{type:"fix",q:"Corregeix: «Me lo va explicar ahir.»",answers:["m'ho","me'l"],e:"«Me lo» és castellà: m'ho (neutre) o me'l (masculí)."},{type:"fix",q:"Corregeix: «Se'l vaig donar a la directora.»",answers:["l'hi","li'l"],e:"«Se lo» castellà → li + el = l'hi (o li'l)."},{type:"fix",q:"Corregeix: «Dona-me-lo.»",answers:["dona-me'l"],e:"Me + el = me'l: dona-me'l."},{type:"fix",q:"Corregeix: «T'el deixo demà.»",answers:["te'l"],e:"Et + el = te'l."},{type:"fix",q:"Corregeix: «M'en vaig a casa.»",answers:["me'n"],e:"Em + en = me'n."},{type:"transform",q:"Substitueix els complements per pronoms: «Dono el llibre a tu.»",answers:["Te'l dono"],e:"A tu → et; el llibre → el: te'l."},{type:"transform",q:"Substitueix els complements per pronoms: «Expliquen la història als nens.»",answers:["Els la expliquen"],e:"Als nens → els; la història → la."},{type:"transform",q:"Substitueix els complements per pronoms: «Hem portat flors a vosaltres.»",answers:["Us n'hem portat"],e:"Flors sense article → en: us n'hem portat."},{type:"transform",q:"Substitueix els complements per pronoms: «Vull dir això a la Maria.»",answers:["Li ho vull dir","Vull dir-li-ho","L'hi vull dir","Vull dir-l'hi"],e:"Li + ho, davant o darrere del verb."},{type:"transform",q:"Substitueix per pronoms: «Compra pa per a mi.»",answers:["Compra-me'n"],e:"Pa sense article → en: compra-me'n."},{type:"choice",q:"Ressenya: amb què comences?",options:["Fitxa i presentació de l'obra","La recomanació final","Una anècdota personal llarga"],answer:"Fitxa i presentació de l'obra",e:"Títol, autor, gènere i de què tracta."},{type:"choice",q:"Ressenya: valoració amb registre adequat",options:["L'obra destaca per una posada en escena molt original.","L'obra està guai.","L'obra mola molt."],answer:"L'obra destaca per una posada en escena molt original.",e:"Lèxic precís, sense col·loquialismes."},{type:"choice",q:"Ressenya: recomanació clara",options:["No us la podeu perdre.","Aneu-hi si voleu, a mi m'és igual.","No sé si us agradarà."],answer:"No us la podeu perdre.",e:"Recomanació directa amb combinació us + la."},{type:"choice",q:"Ressenya: valoració matisada",options:["Tot i que el ritme decau a la segona part, el final és brillant.","El ritme decau però tant se val.","És dolenta i ja està."],answer:"Tot i que el ritme decau a la segona part, el final és brillant.",e:"Concessiva: matisa la crítica."},{type:"choice",q:"Lèxic: persona que dirigeix una pel·lícula",options:["director","directiu","dirigent"],answer:"director",e:"Director o directora."},{type:"choice",q:"Lèxic: conjunt d'actors d'una obra",options:["repartiment","repart","reparto"],answer:"repartiment",e:"Repartiment."},{type:"choice",q:"Ortografia: quina és correcta?",options:["pel·lícula","pel.lícula","película"],answer:"pel·lícula",e:"Pel·lícula, amb ela geminada."},{type:"choice",q:"Ortografia: quina és correcta?",options:["exposició","exposissió","esposició"],answer:"exposició",e:"Exposició."},{type:"choice",q:"Lèxic: forma correcta",options:["escenari","escenario","escenàri"],answer:"escenari",e:"Escenari."},{type:"choice",q:"Tria la forma: «L'obra ___ en una illa durant la postguerra.»",options:["està ambientada","està ambientat","es ambienta"],answer:"està ambientada",e:"L'obra és femení: ambientada."},{type:"choice",q:"Vols que et deixi els apunts? — Sí, ___ deixes?",options:["me'ls","me les","m'els"],answer:"me'ls",e:"Els apunts (masculí plural): em + els = me'ls."},{type:"choice",q:"Ja has enviat la invitació a l'Anna? — Sí, ja ___ he enviada.",options:["la hi","li la","se la"],answer:"la hi",e:"Li + la = la hi (a les Balears també es diu li la)."},{type:"choice",q:"On has posat les claus? — ___ he posat a l'armari.",options:["Les hi","Els hi","Li les"],answer:"Les hi",e:"Les (CD) + hi (lloc): les hi he posat."},{type:"choice",q:"Quants llibres t'han regalat? — ___ han regalat tres.",options:["Me n'","Me'n","M'en"],answer:"Me n'",e:"Me + en davant de vocal (han): me n'han regalat tres."}],skeleton:{brief:"Ressenya per a la revista cultural de l'illa d'una pel·lícula, una obra de teatre o una exposició que hagis vist (170 paraules).",template:`«___», de ___, és ___ (gènere). L'obra està ambientada ___ i narra ___.

Malgrat ___, és una obra ___. Si teniu ocasió de ___, no us ___ perdeu.`,tips:["Dona la fitxa (títol, autor) i una sinopsi sense explicar el final.","Valora almenys dos aspectes positius i un de negatiu.","Fes servir almenys dues combinacions de pronoms (us la, te'l, me'n…)."]},oral:{reading:"El Museu d'Art Contemporani d'Eivissa ocupa un dels edificis més emblemàtics de Dalt Vila. Les seves col·leccions mostren com l'illa va atreure, a partir dels anys cinquanta, artistes de tot el món que hi van trobar llum, llibertat i inspiració. L'entrada és gratuïta i, a més de l'exposició permanent, s'hi organitzen tallers per a famílies.",topic:"Recomana un llibre, una pel·lícula o una exposició que t'hagi marcat: de què tracta, què en destaques i a qui la recomanaries.",phrases:["Us la recomano perquè…","El que més m'ha agradat és…","Tot i que…, …","Si us agraden…, no us la perdeu.","Me'n quedo amb…"],bot:"Fes d'amic/amiga escèptic que no té gaire ganes d'anar a l'exposició o la pel·lícula que l'alumne li recomana. Fes-li preguntes (de què va?, per què hauria d'anar-hi?, quant costa?) i posa objeccions perquè hagi d'argumentar i fer servir pronoms combinats."},exam:{brief:"La revista cultural del Consell convida els lectors a enviar ressenyes. Escriu-ne una sobre una pel·lícula, sèrie, llibre o exposició: presenta l'obra, valora'n els punts forts i febles i fes una recomanació.",words:170,minutes:40,focus:["combinacions de pronoms (te'l, us la, me'n, li ho)","valoració matisada (tot i que, malgrat)","lèxic de la ressenya"],checklist:["He presentat l'obra (títol, autor, de què tracta)","He valorat aspectes positius i negatius","He fet una recomanació clara","He fet servir almenys dues combinacions de pronoms","Té entre 150 i 190 paraules"]}},pq={lessons:["p13","p5"],pretest:[{type:"choice",q:"Connector de contrast:",options:["en canvi","a més","així doncs"],answer:"en canvi",e:"En canvi, tanmateix, ara bé: contrast."},{type:"choice",q:"Connector de conseqüència:",options:["per tant","malgrat això","és a dir"],answer:"per tant",e:"Per tant, en conseqüència, per consegüent."},{type:"choice",q:"«___ hi ha més recursos, l'abandonament escolar no baixa.»",options:["Tot i que","Ja que","Per tant"],answer:"Tot i que",e:"Concessió: tot i que, encara que, malgrat que."},{type:"choice",q:"Quina forma és correcta?",options:["No obstant això","No obstant","Sin embargo"],answer:"No obstant això",e:"No obstant, sol, no és connector correcte."},{type:"choice",q:"Quina està ben puntuada?",options:["Tanmateix, cal més inversió.","Tanmateix cal més inversió.","Tanmateix: cal més inversió."],answer:"Tanmateix, cal més inversió.",e:"Els connectors a principi de frase van seguits de coma."}],model:{title:"Les ràtios també eduquen",genre:"Carta al director (Àrea 3, exercici 2 · 250 paraules)",text:`Senyor director:

Us escric arran de la notícia publicada dijous sobre l'augment d'alumnes per aula als instituts de l'illa. Com a docent, voldria aportar-hi el punt de vista de qui viu aquesta realitat cada dia.

En primer lloc, cal recordar que una aula amb trenta alumnes no és només una aula plena: és una aula on és gairebé impossible atendre la diversitat. D'una banda, els alumnes amb més dificultats no reben l'ajuda que necessiten; de l'altra, els que avancen més ràpidament s'avorreixen. Per tant, tothom hi perd.

Es diu sovint que reduir les ràtios és massa car. Ara bé, quant ens costa l'abandonament escolar? Les dades indiquen que les Illes tenen una de les taxes més altes de l'Estat i, per consegüent, la inversió en educació no és una despesa, sinó una necessitat.

A més a més, la situació afecta també el professorat. Tot i que la majoria de docents fem tot el possible, el cansament i les baixes augmenten cada curs. És a dir, el problema no és la manca de vocació, sinó la manca de mitjans.

En definitiva, demano a l'Administració que escolti la comunitat educativa i que planifiqui amb temps les places necessàries. Si volem una societat més justa, hem de començar per les aules.

Atentament,

Marta Torres Planells
Professora de secundària`,notes:[{quote:"Us escric arran de",note:"Obertura: motiu de la carta (arran de = a causa de, a partir de)."},{quote:"En primer lloc",note:"Ordena els arguments."},{quote:"D'una banda",note:"Parella d'ordenació: d'una banda … de l'altra."},{quote:"Per tant",note:"Conseqüència."},{quote:"Es diu sovint que",note:"Presenta el contraargument."},{quote:"Ara bé",note:"Contrast: comença la refutació."},{quote:"per consegüent",note:"Conseqüència, registre formal."},{quote:"no és una despesa, sinó una necessitat",note:"No… sinó: corregeix una idea. Sinó va junt i amb accent."},{quote:"A més a més",note:"Addició: nou argument."},{quote:"Tot i que",note:"Concessió."},{quote:"És a dir",note:"Reformulació."},{quote:"En definitiva",note:"Conclusió."},{quote:"que escolti la comunitat educativa i que planifiqui",note:"Demanar que + subjuntiu."}]},examples:[{ca:"En primer lloc, analitzarem les causes; en segon lloc, les conseqüències.",note:"Ordenació."},{ca:"D'una banda, l'horari és flexible; de l'altra, és massa llarg.",note:"Parella d'ordenació i contrast."},{ca:"A més a més, cal tenir en compte el cost.",note:"Addició."},{ca:"El projecte és bo; tanmateix, arriba tard.",note:"Contrast: tanmateix, no obstant això, ara bé."},{ca:"Tot i que hi ha pocs recursos, els resultats milloren.",note:"Concessió: tot i que, encara que, malgrat que."},{ca:"Malgrat les dificultats, el curs ha anat bé.",note:"Malgrat + nom."},{ca:"Atès que no hi ha quòrum, la reunió s'ajorna.",note:"Causa formal: atès que, ja que."},{ca:"Les aules són petites; per consegüent, cal reduir les ràtios.",note:"Conseqüència formal."},{ca:"Volem una escola inclusiva, és a dir, que atengui tothom.",note:"Reformulació."},{ca:"A fi que tothom hi pugui participar, la reunió serà en línia.",note:"Finalitat + subjuntiu."},{ca:"No es tracta de gastar més, sinó de gastar millor.",note:"No… sinó: correcció."},{ca:"En definitiva, l'educació és responsabilitat de tots.",note:"Conclusió."},{ca:"Els alumnes i els docents van votar; aquests, a favor, i aquells, en contra.",note:"Cohesió: aquests (el més proper), aquells (el més llunyà)."}],practice:[{type:"choice",q:"Connector d'addició:",options:["a més a més","tanmateix","per tant"],answer:"a més a més",e:"Addició: a més (a més), també, així mateix."},{type:"choice",q:"Connector de concessió:",options:["tot i que","ja que","a fi que"],answer:"tot i que",e:"Concessió: tot i que, encara que, malgrat que."},{type:"choice",q:"Connector de finalitat:",options:["a fi que","atès que","en canvi"],answer:"a fi que",e:"Finalitat: a fi que, perquè (+ subjuntiu)."},{type:"choice",q:"Connector de reformulació:",options:["és a dir","no obstant això","a causa de"],answer:"és a dir",e:"Reformulació: és a dir, o sigui, en altres paraules."},{type:"choice",q:"Connector de conclusió:",options:["en definitiva","en primer lloc","d'una banda"],answer:"en definitiva",e:"Conclusió: en definitiva, en conclusió, en resum."},{type:"choice",q:"Completa: «Les ràtios són altes; ___, els resultats milloren.»",options:["tanmateix","per tant","a més"],answer:"tanmateix",e:"Les dues idees s'oposen → contrast."},{type:"choice",q:"Completa: «No hi ha prou professorat; ___, les classes estan massificades.»",options:["per consegüent","tot i això","en canvi"],answer:"per consegüent",e:"La segona idea és conseqüència de la primera."},{type:"choice",q:"Completa: «L'escola ha de ser inclusiva, ___, ha d'atendre la diversitat de tot l'alumnat.»",options:["és a dir","en canvi","malgrat que"],answer:"és a dir",e:"Explica amb altres paraules → reformulació."},{type:"choice",q:"Completa: «___ els alumnes llegeixin més, la biblioteca obrirà a la tarda.»",options:["Perquè","Ja que","Malgrat que"],answer:"Perquè",e:"Finalitat → perquè + subjuntiu."},{type:"choice",q:"Completa: «D'una banda, l'horari és flexible; ___, és massa llarg.»",options:["de l'altra","a més","per tant"],answer:"de l'altra",e:"D'una banda … de l'altra (o per altra banda)."},{type:"choice",q:"Quina forma és correcta?",options:["Malgrat això","Malgrat de això","Malgrat a això"],answer:"Malgrat això",e:"Malgrat + nom o pronom, sense preposició."},{type:"choice",q:"Quina forma és correcta?",options:["per tant","por lo tant","pel tant"],answer:"per tant",e:"Per tant."},{type:"choice",q:"Quina forma és correcta?",options:["a més a més","ademés","a més de més"],answer:"a més a més",e:"A més a més (o a més)."},{type:"choice",q:"Quina forma és correcta?",options:["atès que","dado que","atés que"],answer:"atès que",e:"Atès que: causa, registre formal."},{type:"choice",q:"Quina forma és correcta?",options:["en primer lloc","en primer lugar","primer de tot lloc"],answer:"en primer lloc",e:"En primer lloc, en segon lloc…"},{type:"choice",q:"Quina està ben puntuada?",options:["Per tant, hem de canviar el model.","Per tant hem, de canviar el model.","Per, tant hem de canviar el model."],answer:"Per tant, hem de canviar el model.",e:"Connector + coma a principi de frase."},{type:"choice",q:"Cohesió: «Els alumnes i els professors van votar; aquests van votar a favor.» Qui són «aquests»?",options:["els professors","els alumnes","tots"],answer:"els professors",e:"Aquests remet al més proper; aquells, al més llunyà."},{type:"choice",q:"Cohesió: per no repetir «els docents», quin sinònim va bé?",options:["el professorat","els discents","l'alumnat"],answer:"el professorat",e:"Professorat = conjunt de docents."},{type:"choice",q:"Carta al director: salutació habitual",options:["Senyor director:","Hola director!","Estimat amic:"],answer:"Senyor director:",e:"Senyor director, / Senyora directora, seguit de dos punts o coma."},{type:"choice",q:"Carta al director: quin és l'objectiu?",options:["Expressar una opinió sobre un tema d'actualitat","Demanar feina","Explicar un viatge"],answer:"Expressar una opinió sobre un tema d'actualitat",e:"És un text argumentatiu breu, publicat al diari."},{type:"choice",q:"Quina frase rebat bé un argument?",options:["Es diu sovint que és car. Ara bé, les dades demostren el contrari.","Això és mentida i prou.","No m'agrada aquesta idea."],answer:"Es diu sovint que és car. Ara bé, les dades demostren el contrari.",e:"Presentes l'argument contrari i el refutes amb dades."},{type:"choice",q:"Carta al director: tancament adequat",options:["Esperant que aquestes reflexions serveixin per obrir un debat necessari.","Res més, adeu.","I això és tot, bon dia."],answer:"Esperant que aquestes reflexions serveixin per obrir un debat necessari.",e:"Tancament formal que reprèn l'objectiu."},{type:"choice",q:"Lèxic: deixar els estudis abans d'acabar-los",options:["abandonament escolar","fracàs familiar","absentisme laboral"],answer:"abandonament escolar",e:"Abandonament escolar prematur."},{type:"choice",q:"Lèxic: nombre d'alumnes per grup",options:["ràtio","quota","índex"],answer:"ràtio",e:"La ràtio (femení), amb accent."},{type:"fix",q:"Corregeix el connector: «Sin embargo, la proposta no convenç.»",answers:["tanmateix","no obstant això"],e:"Tanmateix o no obstant això."},{type:"fix",q:"Corregeix: «Ademés, cal reduir les ràtios.»",answers:["a més","a més a més"],e:"«Ademés» és castellanisme."},{type:"fix",q:"Corregeix: «Aixís doncs, la mesura és necessària.»",answers:["així"],e:"Així doncs."},{type:"fix",q:"Corregeix l'expressió: «A nivell educatiu, la mesura és un error.»",answers:["en l'àmbit educatiu","pel que fa a l'educació","des del punt de vista educatiu"],e:"«A nivell de» només és correcte amb sentit d'altura real: millor en l'àmbit de, pel que fa a."},{type:"fix",q:"Corregeix: «Contra més llegeixes, més aprens.»",answers:["com"],e:"Com més…, més… (mai «contra més»)."},{type:"fix",q:"Corregeix: «El projecte és bo, pues té el suport de les famílies.»",answers:["ja que","perquè","atès que"],e:"«Pues» és castellà: ja que, perquè."},{type:"transform",q:"Uneix amb «tot i que»: «Fa poc que hi treballa. Coneix bé l'escola.»",answers:["Tot i que fa poc que hi treballa, coneix bé l'escola","Coneix bé l'escola tot i que fa poc que hi treballa"],e:"Concessió."},{type:"transform",q:"Uneix amb «per tant»: «Les aules són petites. Cal reduir les ràtios.»",answers:["Les aules són petites, per tant, cal reduir les ràtios"],e:"Conseqüència."},{type:"transform",q:"Evita la repetició amb un pronom: «Vaig llegir l'informe i després vaig enviar l'informe al director.»",answers:["Vaig llegir l'informe i després el vaig enviar al director","Vaig llegir l'informe i després vaig enviar-lo al director"],e:"Cohesió: el pronom evita repetir el nom."},{type:"transform",q:"Reformula amb «malgrat»: «Encara que plovia, vam fer l'excursió.»",answers:["Malgrat la pluja, vam fer l'excursió","Malgrat que plovia, vam fer l'excursió"],e:"Malgrat + nom o malgrat que + verb."},{type:"transform",q:"Uneix amb «no… sinó»: «El problema no és la vocació. El problema és la manca de mitjans.»",answers:["El problema no és la vocació, sinó la manca de mitjans"],e:"No… sinó corregeix la primera idea."},{type:"gap",q:"No es tracta de gastar més, ___ de gastar millor.",answers:["sinó"],e:"No… sinó (amb accent)."},{type:"gap",q:"___ que no hi ha quòrum, s'ajorna la reunió. (causa, registre formal)",answers:["Atès"],e:"Atès que."},{type:"gap",q:"Hem obert la sala a la tarda ___ que tothom hi pugui estudiar. (finalitat)",answers:["a fi"],e:"A fi que + subjuntiu."},{type:"gap",q:"En primer lloc, parlarem de l'horari; en ___ lloc, del pressupost.",answers:["segon"],e:"En primer lloc, en segon lloc, finalment."},{type:"choice",q:"Quina és correcta?",options:["No és car, sinó barat.","No és car, si no barat.","No és car, sino barat."],answer:"No és car, sinó barat.",e:"Sinó (junt i amb accent) després d'una negació. Si no = condició."}],skeleton:{brief:"Carta al director del diari local en resposta a la notícia «El Govern estudia allargar el calendari escolar fins a finals de juny» (250 paraules).",template:`Senyor director:

___`,tips:["Fes servir almenys vuit connectors diferents (ordenació, addició, contrast, conseqüència, reformulació, conclusió).","Rebat un argument contrari amb una dada o un exemple.","Evita repeticions amb pronoms i sinònims."]},oral:{reading:"Diversos estudis recents indiquen que l'alumnat que llegeix per plaer almenys trenta minuts al dia obté millors resultats en totes les matèries, no només en llengua. Per això, cada vegada més centres dediquen un temps diari a la lectura silenciosa. Tanmateix, els experts recorden que l'exemple de la família continua essent decisiu.",topic:"Deures a casa: s'haurien d'eliminar? Argumenta la teva postura i rebat la contrària.",phrases:["D'una banda…; de l'altra…","Es diu sovint que… Ara bé…","Per consegüent…","No es tracta de… sinó de…","En definitiva…"],bot:"Fes de pare/mare que defensa que els deures són imprescindibles. L'alumne és un docent que proposa reduir-los. Discutiu amb respecte: demana-li arguments, dades i exemples, i posa-li objeccions perquè hagi de rebatre fent servir connectors."},exam:{brief:"El diari de l'illa ha publicat que el Govern vol reduir les hores de llengua estrangera a primària per augmentar les de matemàtiques. Escriu una carta al director en què donis la teva opinió, la defensis amb arguments i rebatis un argument contrari.",words:250,minutes:60,focus:["connectors variats (ordenació, contrast, conseqüència, reformulació, conclusió)","cohesió: pronoms i sinònims per evitar repeticions","estructura de la carta al director"],checklist:["He fet servir la salutació i el comiat adequats","He explicat el motiu de la carta al principi","He fet servir almenys vuit connectors diferents","He rebatut un argument contrari","He evitat repeticions","Té entre 230 i 270 paraules"]}},jv={u1:{examples:[{ca:"La vaig conèixer a la feina.",note:"La: complement directe femení davant consonant."},{ca:"L'he vista al mercat aquest matí.",note:"L' davant vocal; el participi concorda amb el pronom femení."},{ca:"Li he escrit un correu.",note:"Li: complement indirecte (a ell o a ella)."},{ca:"Els he explicat el problema.",note:"Els: complement indirecte plural, masculí o femení."},{ca:"No ho sé.",note:"Ho substitueix una idea o una frase sencera."},{ca:"Te l'envio demà.",note:"Combinació te + el: primer l'indirecte."},{ca:"Digues-li que l'esperem.",note:"Imperatiu + li amb guionet; l' és el complement directe d'esperar."},{ca:"La vull veure. / Vull veure-la.",note:"Amb perífrasis, el pronom pot anar davant o darrere."},{ca:"M'agrada molt llegir.",note:"Agradar porta complement indirecte: em, et, li…"},{ca:"T'agrada el cinema?",note:"Davant vocal, et s'apostrofa: t'."},{ca:"Quan era petita, anava sovint a la platja.",note:"Imperfet per a costums del passat."},{ca:"L'any 2010 em vaig traslladar a Eivissa.",note:"Passat perifràstic per a un fet puntual."}],extra:[{type:"choice",q:"Coneixes la Marta? Sí, ___ conec des de fa anys.",options:["la","li","l'"],answer:"la",e:"Conèixer algú: complement directe femení → la."},{type:"choice",q:"Has vist els teus cosins? Sí, ___ he vist.",options:["els","los","les"],answer:"els",e:"Complement directe masculí plural: els."},{type:"choice",q:"Has parlat amb el director? Sí, ___ he dit que vindràs.",options:["li","el","l'"],answer:"li",e:"Dir alguna cosa a algú: complement indirecte → li."},{type:"choice",q:"Saps on és la clau? No, no ___ sé.",options:["ho","la","el"],answer:"ho",e:"Saber on és la clau = saber això → ho."},{type:"choice",q:"Vols el diari? Sí, dona-___.",options:["me'l","me el","m'el"],answer:"me'l",e:"Em + el darrere de l'imperatiu: dona-me'l."},{type:"choice",q:"A tu, ___ agrada el cinema?",options:["t'","et","te"],answer:"t'",e:"Davant vocal (agrada), et → t'."},{type:"choice",q:"Ahir ___ una carta a la meva àvia.",options:["vaig escriure","escrivia","escriuré"],answer:"vaig escriure",e:"Fet puntual i acabat: passat perifràstic."},{type:"choice",q:"Quan tenia vint anys, ___ a Barcelona per estudiar.",options:["me'n vaig anar","me'n anava","em vaig"],answer:"me'n vaig anar",e:"Anar-se'n en passat perifràstic: me'n vaig anar."},{type:"gap",q:"«Escolta la professora» → Escolta-___.",answers:["la"],e:"Complement directe femení darrere de l'imperatiu."},{type:"gap",q:"«Porta els llibres» → Porta-___.",answers:["els"],e:"Complement directe masculí plural."},{type:"transform",q:"Substitueix el complement: «Vaig trobar les claus al cotxe.»",answers:["Les vaig trobar al cotxe","Vaig trobar-les al cotxe"],e:"Les claus → les."},{type:"transform",q:"Substitueix el complement indirecte: «Diré la veritat a la jutgessa.»",answers:["Li diré la veritat"],e:"A la jutgessa → li."},{type:"transform",q:"Substitueix el complement: «Hem convidat els veïns.»",answers:["Els hem convidat"],e:"Els veïns → els."},{type:"fix",q:"Corregeix: «Les he dit que arribaré tard.» (a elles)",answers:["els"],e:"El complement indirecte plural és els, també en femení."},{type:"fix",q:"Corregeix: «A la meva mare la encanta cuinar.»",answers:["li"],e:"Encantar porta complement indirecte: li encanta."},{type:"fix",q:"Corregeix: «Desde que vaig arribar, parlo català.»",answers:["des que"],e:"Davant de verb conjugat: des que."}]},u2:{examples:[{ca:"Vas sovint a Formentera? Sí, hi vaig cada estiu.",note:"Hi substitueix un lloc."},{ca:"Del preu, ja en parlarem.",note:"En substitueix un complement introduït per de."},{ca:"Tens fills? Sí, en tinc dos.",note:"En + numeral."},{ca:"No n'hi ha prou amb disculpes.",note:"Expressió fixa: no és suficient."},{ca:"Hi penso cada dia.",note:"Pensar en → hi."},{ca:"Me'n vaig a casa.",note:"Anar-se'n: en forma part del verb."},{ca:"No hi confio gens.",note:"Confiar en → hi."},{ca:"En vinc ara mateix, de l'oficina.",note:"Venir d'un lloc → en."},{ca:"Hi ha molts pisos buits.",note:"Haver-hi existencial sempre en singular."},{ca:"Ves-hi demà, que avui és tancat.",note:"Imperatiu + hi amb guionet."},{ca:"Parla'n amb el propietari.",note:"Parlar de → en; darrere de vocal, 'n."},{ca:"No en sabia res.",note:"Saber res d'alguna cosa → en."}],extra:[{type:"choice",q:"Has estat mai a Menorca? Sí, ___ he estat dues vegades.",options:["hi","en","la"],answer:"hi",e:"Lloc → hi."},{type:"choice",q:"Quants anys fa que vius aquí? ___ fa deu.",options:["En","Hi","Els"],answer:"En",e:"Quantitat (anys) → en."},{type:"choice",q:"Te'n recordes de la teva primera casa? Sí, ___ recordo molt bé.",options:["me'n","m'hi","em"],answer:"me'n",e:"Recordar-se de → me'n recordo."},{type:"choice",q:"Pujaràs a la terrassa? Sí, ___ pujaré després.",options:["hi","en","la"],answer:"hi",e:"Lloc → hi."},{type:"choice",q:"Has comprat pa? Sí, ___ he comprat una barra.",options:["n'","l'","hi"],answer:"n'",e:"Nom sense article + quantitat → en."},{type:"gap",q:"Has pensat en el que et vaig dir? Sí, ___ he pensat.",answers:["hi"],e:"Pensar en → hi."},{type:"gap",q:"Quantes cadires vols? ___ vull sis.",answers:["en"],e:"En + numeral."},{type:"gap",q:"«Ves a la farmàcia» → Ves-___ ara.",answers:["hi"],e:"Imperatiu + hi."},{type:"transform",q:"Substitueix el lloc: «Anirem al concert dissabte.»",answers:["Hi anirem dissabte"],e:"Al concert → hi."},{type:"transform",q:"Substitueix el complement: «Vull tres entrades.»",answers:["En vull tres"],e:"Numeral: en vull tres."},{type:"transform",q:"Substitueix el complement: «No sé res del contracte.»",answers:["No en sé res"],e:"Del contracte → en."},{type:"transform",q:"Substitueix el lloc: «Viu a Sant Antoni des de fa anys.»",answers:["Hi viu des de fa anys"],e:"A Sant Antoni → hi."},{type:"fix",q:"Corregeix: «Hi han problemes amb la caldera.»",answers:["hi ha"],e:"Existencial en singular."},{type:"fix",q:"Corregeix: «Estic segura de que ho arreglaran.»",answers:["que"],e:"La preposició cau davant de que."},{type:"fix",q:"Corregeix: «Han hagut moltes queixes aquest mes.»",answers:["hi ha hagut"],e:"Existencial: hi ha hagut."},{type:"choice",q:"Quin tractament fas servir amb un administrador de finques que no coneixes?",options:["vostè","tu","vosaltres"],answer:"vostè",e:"En una carta formal: vostè (o vós), sempre el mateix."},{type:"choice",q:"Com comences una queixa formal?",options:["Em dirigeixo a vostè per…","Ei, què tal?","Escolta, que…"],answer:"Em dirigeixo a vostè per…",e:"Obertura formal."}]},u3:{examples:[{ca:"El llibre que llegeixo és molt interessant.",note:"Que sense preposició i sense accent."},{ca:"L'empresa on treballo té cent empleats.",note:"On per a llocs."},{ca:"La persona amb qui vaig parlar era molt amable.",note:"Preposició + qui per a persones."},{ca:"El tema de què parlàvem és important.",note:"Preposició + què (amb accent) per a coses."},{ca:"Les raons per les quals m'interessa són clares.",note:"Relatiu compost, registre formal."},{ca:"La ciutat en què vaig néixer és petita.",note:"En què, equivalent a on."},{ca:"No sé què vols dir.",note:"Què interrogatiu en una pregunta indirecta."},{ca:"Això és el que necessito.",note:"El que (mai «lo que»)."},{ca:"La meva companya, que és de Menorca, parla tres llengües.",note:"Relativa explicativa entre comes."},{ca:"La sala a la qual es dirigeix és al primer pis.",note:"A + la qual."},{ca:"Tinc un amic el pare del qual és metge.",note:"Possessiu relatiu: el … del qual."},{ca:"És una feina amb la qual em sento realitzada.",note:"Amb + la qual."}],extra:[{type:"choice",q:"La noia ___ t'he presentat és la meva cosina.",options:["que","qui","la qual"],answer:"que",e:"Complement directe sense preposició → que."},{type:"choice",q:"És el company amb ___ sempre parlo.",options:["qui","que","qual"],answer:"qui",e:"Preposició + persona → qui."},{type:"choice",q:"El projecte en ___ treballo és molt ambiciós.",options:["què","que","qui"],answer:"què",e:"Preposició + cosa → què."},{type:"choice",q:"No entenc ___ ha passat.",options:["què","que","qual"],answer:"què",e:"Interrogativa indirecta → què."},{type:"choice",q:"Aquest és el despatx ___ treballa la directora.",options:["on","que","qui"],answer:"on",e:"Lloc → on."},{type:"choice",q:"Les persones ___ hi van anar estaven contentes.",options:["que","qui","les quals"],answer:"que",e:"Subjecte en una relativa especificativa → que."},{type:"gap",q:"El curs ___ m'he apuntat comença dilluns. (apuntar-se a)",answers:["a què","al qual"],e:"Apuntar-se a → a què / al qual."},{type:"gap",q:"La persona de ___ et parlo és la meva cap.",answers:["qui","la qual"],e:"Persona amb preposició → qui o la qual."},{type:"gap",q:"Els motius pels ___ ho deixo són personals.",answers:["quals"],e:"Pels quals."},{type:"transform",q:"Uneix: «Treballo en una empresa. L'empresa fabrica mobles.»",answers:["Treballo en una empresa que fabrica mobles"],e:"Subjecte → que."},{type:"transform",q:"Uneix: «Aquesta és la companya. Et vaig parlar de la companya.»",answers:["Aquesta és la companya de qui et vaig parlar","Aquesta és la companya de la qual et vaig parlar"],e:"Parlar de + persona → de qui / de la qual."},{type:"fix",q:"Corregeix: «És una persona que la seva feina és molt important.»",answers:["la feina de la qual"],e:"Possessiu relatiu: la feina de la qual."},{type:"fix",q:"Corregeix: «La raó per la que t'escric és…»",answers:["per la qual","per què"],e:"Mai «la que» darrere de preposició."},{type:"fix",q:"Corregeix: «El dia en que vaig començar, plovia.»",answers:["en què"],e:"Relatiu amb preposició: en què, amb accent."},{type:"choice",q:"Quina expressió és correcta?",options:["dur a terme una tasca","portar a cap una tasca","llevar a terme una tasca"],answer:"dur a terme una tasca",e:"Dur a terme."}]}},mq={lessons:["p4"],pretest:[{type:"choice",q:"Aquest regal és ___ la teva mare.",options:["per a","per","pera"],answer:"per a",e:"Destinatari → per a."},{type:"choice",q:"Vam passar ___ Santa Eulària.",options:["per","per a","a per"],answer:"per",e:"Lloc de pas → per."},{type:"choice",q:"Eivissa té més habitants ___ Formentera.",options:["que","de","com"],answer:"que",e:"Comparatiu de superioritat: més … que."},{type:"choice",q:"Avui fa ___ calor com ahir.",options:["tanta","tan","tant"],answer:"tanta",e:"Tant + nom, concordat: calor és femení → tanta calor com."},{type:"choice",q:"___ més plàstic fem servir, més contaminem.",options:["Com","Contra","Quant"],answer:"Com",e:"Comparació proporcional: com més… més…"}],model:{title:"Els residus a Eivissa",genre:"Explicació d'un gràfic (Àrea 3, exercici 1 · 170 paraules) · dades d'exemple",text:`El gràfic mostra l'evolució dels residus urbans recollits a Eivissa entre el 2018 i el 2025, en milers de tones.

En primer lloc, s'observa que la quantitat total de residus va augmentar de manera constant fins al 2019, quan va assolir el màxim: 145.000 tones. El 2020, en canvi, va caure bruscament fins a 110.000 tones, a causa de la reducció del turisme. A partir del 2021, la xifra es va recuperar i, el 2025, ja era tan alta com abans de la pandèmia.

Pel que fa al reciclatge, la tendència és més positiva. La recollida selectiva ha passat del 16 % al 31 % del total, és a dir, gairebé s'ha duplicat. Tot i això, encara és molt més baixa que la mitjana europea.

En conclusió, les dades indiquen que com més visitants rep l'illa, més residus genera. Per això, caldrien campanyes específiques per als establiments turístics i més punts de recollida per a residents i visitants.`,notes:[{quote:"El gràfic mostra",note:"Obertura: què mostra, on i en quin període."},{quote:"va assolir el màxim",note:"Lèxic de dades: assolir el màxim / el mínim."},{quote:"va caure bruscament",note:"Verb de canvi + adverbi que n'indica la intensitat."},{quote:"a causa de",note:"Causa. Mai «degut a»."},{quote:"tan alta com",note:"Igualtat amb adjectiu: tan … com."},{quote:"Pel que fa al reciclatge",note:"Introdueix un aspecte nou del gràfic."},{quote:"és a dir",note:"Reformula la dada amb paraules."},{quote:"molt més baixa que",note:"Comparatiu: més … que, intensificat amb molt."},{quote:"com més visitants rep l'illa, més residus genera",note:"Comparació proporcional: com més…, més…"},{quote:"per als establiments turístics",note:"Per a + destinatari (per a + els = per als)."}]},examples:[{ca:"Aquest projecte és per a les escoles de l'illa.",note:"Per a: destinatari."},{ca:"El pla es va aprovar per unanimitat.",note:"Per: manera."},{ca:"Vam arribar per la carretera de Sant Joan.",note:"Per: lloc de pas."},{ca:"L'estudi va ser elaborat per un equip de biòlegs.",note:"Per: agent de la passiva."},{ca:"No hi van anar per la vaga d'autobusos.",note:"Per: causa."},{ca:"Ens ho van enviar per missatgeria.",note:"Per: mitjà."},{ca:"Hi ha un carril per a bicicletes.",note:"Per a + nom: finalitat."},{ca:"Aquest estiu ha fet més calor que mai.",note:"Més … que."},{ca:"La platja no és tan neta com l'any passat.",note:"Tan + adjectiu + com."},{ca:"Hi ha tants turistes com residents.",note:"Tant + nom concordat + com."},{ca:"Com més plàstic reciclem, menys residus enviem a l'abocador.",note:"Comparació proporcional."},{ca:"El consum s'ha disparat un 30 %, però l'any passat es va mantenir estable.",note:"Lèxic de gràfics: disparar-se, mantenir-se estable."},{ca:"Les vendes s'han reduït a la meitat.",note:"Reduir-se a la meitat; duplicar-se, triplicar-se."}],practice:[{type:"choice",q:"Ho he fet ___ tu, perquè no et preocupis.",options:["per","per a","pera"],answer:"per",e:"Motiu (a causa teva, pensant en tu) → per."},{type:"choice",q:"Aquesta sala és ___ reunions.",options:["per a","per","a per"],answer:"per a",e:"Finalitat + nom → per a."},{type:"choice",q:"L'informe va ser redactat ___ la directora.",options:["per","per a","de"],answer:"per",e:"Agent de la passiva → per."},{type:"choice",q:"T'ho envio ___ correu electrònic.",options:["per","per a","amb"],answer:"per",e:"Mitjà → per."},{type:"choice",q:"Ens veurem ___ Nadal.",options:["per","per a","a"],answer:"per",e:"Temps aproximat → per Nadal."},{type:"choice",q:"Hem venut el cotxe ___ 3.000 euros.",options:["per","per a","a"],answer:"per",e:"Preu → per."},{type:"choice",q:"Tenim un pressupost ___ la campanya de reciclatge.",options:["per a","per","pera"],answer:"per a",e:"Destinació → per a."},{type:"choice",q:"No vam sortir ___ la pluja.",options:["per","per a","de"],answer:"per",e:"Causa → per."},{type:"gap",q:"Hem comprat flors ___ (per a + els) avis.",answers:["per als"],e:"Per a + els = per als."},{type:"gap",q:"Passarem ___ (per + el) centre.",answers:["pel"],e:"Per + el = pel."},{type:"gap",q:"Eivissa és més petita ___ Mallorca.",answers:["que"],e:"Més … que."},{type:"gap",q:"Formentera no és tan gran ___ Eivissa.",answers:["com"],e:"Tan … com."},{type:"gap",q:"Aquest estiu hi ha hagut ___ turistes com l'any passat.",answers:["tants"],e:"Tant + nom concordat: tants turistes."},{type:"gap",q:"___ més llegeixes, més vocabulari aprens.",answers:["com"],e:"Com més…, més…"},{type:"fix",q:"Corregeix: «Contra més recicles, millor.»",answers:["com més"],e:"«Contra més» és un calc: com més."},{type:"fix",q:"Corregeix: «Aquest any és més pitjor que l'anterior.»",answers:["pitjor"],e:"Pitjor ja és comparatiu: no porta més."},{type:"fix",q:"Corregeix: «És tan important que l'aigua.»",answers:["com"],e:"Tan … com, no tan … que."},{type:"transform",q:"Uneix amb un comparatiu: «L'aigua és cara. La llum ho és més.»",answers:["La llum és més cara que l'aigua"],e:"Més … que."},{type:"choice",q:"Quan una xifra puja molt de cop, diem que…",options:["ha augmentat bruscament","s'ha mantingut estable","ha disminuït lleugerament"],answer:"ha augmentat bruscament",e:"També: s'ha disparat."},{type:"choice",q:"Si una xifra passa de 10 a 30, s'ha…",options:["triplicat","duplicat","reduït a la meitat"],answer:"triplicat",e:"×3 = triplicar-se."},{type:"choice",q:"Vaig entrar ___ la porta del darrere.",options:["per","per a","a per"],answer:"per",e:"Lloc de pas → per."},{type:"choice",q:"Ho farem ___ telèfon.",options:["per","per a","a"],answer:"per",e:"Mitjà → per telèfon."},{type:"choice",q:"Aquest any ha plogut ___ que l'any passat.",options:["menys","menys de","menor"],answer:"menys",e:"Menys … que."},{type:"choice",q:"És la platja ___ bonica de l'illa.",options:["més","tan","molt"],answer:"més",e:"Superlatiu: la més…"},{type:"choice",q:"Consumim el doble d'aigua ___ fa deu anys.",options:["que","de","com"],answer:"que",e:"El doble … que."},{type:"gap",q:"No tinc ___ temps com tu.",answers:["tant"],e:"Tant + nom masculí singular."},{type:"gap",q:"Ell no corre tant ___ jo.",answers:["com"],e:"Tant com, amb verb."},{type:"gap",q:"Les emissions han baixat un 10 % respecte ___ (de + el) 2020.",answers:["del"],e:"Respecte de + el = respecte del."},{type:"fix",q:"Corregeix: «Degut a la sequera, falta aigua.»",answers:["a causa de"],e:"Causa: a causa de."},{type:"fix",q:"Corregeix: «Ho explico per a que ho entenguis.»",answers:["perquè","per tal que"],e:"Finalitat amb verb conjugat: perquè."},{type:"transform",q:"Reformula amb com més… més: «Si fa més calor, consumim més aigua.»",answers:["Com més calor fa, més aigua consumim"],e:"Comparació proporcional."},{type:"choice",q:"Una xifra que no canvia…",options:["s'ha mantingut estable","ha fluctuat","s'ha disparat"],answer:"s'ha mantingut estable",e:"Mantenir-se estable."},{type:"choice",q:"«Gairebé s'ha duplicat» vol dir que…",options:["ha augmentat quasi el doble","ha baixat a la meitat","no ha canviat"],answer:"ha augmentat quasi el doble",e:"Duplicar-se: fer-se el doble."},{type:"choice",q:"Per presentar un gràfic comences amb…",options:["El gràfic mostra…","Bueno, doncs…","Com que sí…"],answer:"El gràfic mostra…",e:"Obertura neutra i formal."},{type:"choice",q:"Quin connector introdueix un nou aspecte del gràfic?",options:["Pel que fa a","A nivell de","En base a"],answer:"Pel que fa a",e:"Pel que fa a / quant a."}],skeleton:{brief:"Explica aquestes dades (consum d'aigua per persona i dia, en litres): 2015: 160 · 2018: 175 · 2020: 150 · 2023: 190 · 2025: 200.",template:`El gràfic mostra ___ entre el ___ i el ___.

En primer lloc, s'observa que ___. El 2020, en canvi, ___, a causa de ___.

A partir del 2021, ___ i, el 2025, ___ (fes servir tan… com o més… que).

Pel que fa a ___, ___.

En conclusió, ___. Per això, caldria ___ per a ___.`,tips:["Fes servir verbs de canvi: augmentar, disminuir, assolir el màxim, mantenir-se estable.","Inclou almenys dos comparatius.","Fes servir per i per a correctament almenys una vegada cadascun."]},oral:{reading:"Les praderies de posidònia que hi ha entre Eivissa i Formentera són Patrimoni de la Humanitat. Aquesta planta marina oxigena l'aigua, protegeix les platges de l'erosió i fa que el mar sigui tan transparent. Tanmateix, les àncores de les embarcacions en destrueixen una part cada estiu.",topic:"El canvi climàtic a les Illes: causes, conseqüències i què hi podem fer.",phrases:["Una de les causes principals és…","Això es deu a…","Com a conseqüència…","Si no hi posem remei…","Per evitar-ho, caldria…"],bot:"Fes de regidor/a de Medi Ambient d'un ajuntament d'Eivissa. L'alumne és un veí que proposa mesures per reduir els residus a l'estiu. Discuteix la viabilitat de cada proposta, posa objeccions de pressupost i arribeu a un pla d'acció."},exam:{brief:"Dades d'arribada de turistes a una illa (milions): 2019: 3,2 · 2020: 0,9 · 2022: 3,0 · 2024: 3,5. Escriu un text per al butlletí de l'escola que expliqui l'evolució de les dades i en tregui una conclusió.",words:170,minutes:40,focus:["lèxic per descriure dades (augmentar, disminuir, assolir el màxim)","comparatius (més… que, tan… com, com més… més)","per i per a"],checklist:["He presentat què mostren les dades i el període","He descrit els canvis amb verbs variats","He fet servir almenys dos comparatius","He tret una conclusió","Té entre 150 i 190 paraules"]}},hq={lessons:["p8","p9"],pretest:[{type:"choice",q:"Quina paraula porta accent?",options:["cafè","examen","jove"],answer:"cafè",e:"Aguda acabada en vocal → accent."},{type:"choice",q:"Com s'escriu?",options:["la universitat","l'universitat","le universitat"],answer:"la universitat",e:"Davant de u àtona, l'article femení no s'apostrofa."},{type:"choice",q:"Tinc molta ___: arribo tard.",options:["pressa","presa","preza"],answer:"pressa",e:"Pressa (urgència) amb ss; presa és «agafada» o una resclosa."},{type:"choice",q:"Quina forma és correcta des del 2017?",options:["soc","sóc","sòc"],answer:"soc",e:"Soc ja no porta accent diacrític."},{type:"choice",q:"Com s'escriu?",options:["col·legi","colegi","col.legi"],answer:"col·legi",e:"Ela geminada amb punt volat: l·l."}],model:{title:"Sol·licitud de menú adaptat",genre:"Instància (Àrea 3, exercici 1 · 170 paraules)",text:`Dades de la persona sol·licitant

L'Ajuntament de Sant Joan de Labritja ha inaugurat aquest dissabte un espai on els veïns poden intercanviar llavors de varietats locals, amb l'objectiu de recuperar cultius tradicionals que estaven a punt de desaparèixer.

La biblioteca, situada a l'antic edifici de les escoles, compta amb més de tres-centes varietats de tomàtigues, faves, mongetes i cereals cedides per pagesos de l'illa. Qualsevol persona empadronada a Eivissa en pot agafar un sobre gratuïtament, amb el compromís de retornar-ne una part després de la collita.

Segons la regidora d'Agricultura, la iniciativa vol «evitar que es perdi un patrimoni que ha passat de pares a fills durant segles». Els promotors també preveuen organitzar tallers de sembra per a escoles i associacions de veïns a partir de la primavera.

Més endavant vaig estudiar Magisteri a Palma i hi vaig viure cinc anys. Vaig fer les pràctiques en una escola de Manacor, on vaig descobrir que la llengua no és només una assignatura, sinó una manera d'entrar en la vida de la gent.

Actualment treballo de mestre a Vila i faig servir el català cada dia. Encara cometo errors, sobretot amb els pronoms, però ja no em fa por parlar-lo. El meu objectiu és aconseguir el certificat C1 enguany i, a més a més, animar els meus alumnes a viure en català.`,notes:[{quote:"Vaig néixer",note:"Passat perifràstic (vaig + infinitiu): el temps habitual per narrar fets acabats."},{quote:"quan tenia deu anys",note:"Imperfet per descriure la situació de fons."},{quote:"l'entenia",note:"Pronom de complement directe: el català → l' (davant vocal)."},{quote:"no el parlava",note:"El mateix complement directe davant consonant: el."},{quote:"m'ho repetia",note:"Combinació de pronoms: em (a mi) + ho (allò que deia)."},{quote:"hi vaig viure",note:"Hi substitueix el lloc: a Palma."},{quote:"Més endavant",note:"Marcador temporal que ordena la biografia."},{quote:"sinó",note:"Després d'una negació (no és només…, sinó…), s'escriu junt."},{quote:"parlar-lo",note:"Pronom darrere de l'infinitiu, amb guionet."},{quote:"a més a més",note:"Connector d'addició; dona riquesa al tancament."}]},practice:[{type:"transform",q:"Substitueix el complement per un pronom: «Vaig conèixer la Joana a l'institut.»",answers:["La vaig conèixer a l'institut","Vaig conèixer-la a l'institut"],e:"La Joana és complement directe femení → la."},{type:"transform",q:"Substitueix el complement indirecte: «Escriuré un correu al director.»",answers:["Li escriuré un correu"],e:"Al director (a qui?) → li."},{type:"transform",q:"Substitueix el complement: «Compraré els bitllets demà.»",answers:["Els compraré demà"],e:"Els bitllets → els."},{type:"transform",q:"Substitueix el complement: «Has llegit les instruccions?»",answers:["Les has llegides?","Les has llegit?","Les has llegides","Les has llegit"],e:"Les instruccions → les. En registre formal, el participi concorda: les has llegides."},{type:"transform",q:"Substitueix la frase subratllada per un pronom: «No sé si vindrà.»",answers:["No ho sé"],e:"Una oració sence ","la"],answer:"hi",e:"Pensar en alguna cosa → hi penso."},{type:"choice",q:"Quants pisos has vist? ___ he vist tres.",options:["N'","Hi","Els"],answer:"N'",e:"Amb un numeral, el nom se substitueix per en: n'he vist tres."}],model:{title:"Queixa a l'administrador de finques",genre:"Carta formal de queixa (Àrea 3, exercici 1 · 170 paraules)",text:`Sant Antoni de Portmany, 12 de novembre de 2026

Benvolguts senyors,

Em dirigeixo a vostès com a llogatera del pis 2n B del carrer de Ramon Llull, 14, per exposar-los un problema que dura des del mes de setembre.

En primer lloc, hi ha humitats greus al dormitori principal. Els ho vaig comunicar per telèfon el 3 d'octubre, però encara no he rebut cap resposta. Hi he posat un deshumidificador, però no n'hi ha prou. A més a més, la caldera s'atura cada dos o tres dies, de manera que sovint ens quedem sense aigua calenta.

Entenc que una reparació pot requerir temps; tanmateix, fa massa setmanes que vostès en tenen notícia i la situació afecta la salut de la família.

Per tot això, els sol·licito que enviïn un tècnic abans del 30 de novembre i que em confirmin per escrit la data de la visita. En cas contrari, em veuré obligada a presentar una reclamació a l'Oficina de Consum.

Atentament,

Laura Costa Ribas`,notes:[{quote:"Benvolguts senyors,",note:"Salutació formal; acaba amb coma."},{quote:"Em dirigeixo a vostès",note:"Obertura formal. Mantén el tractament de vostè en tota la carta."},{quote:"Els ho vaig comunicar",note:"Els (a vostès) + ho (el problema)."},{quote:"Hi he posat",note:"Hi = al dormitori (lloc)."},{quote:"no n'hi ha prou",note:"Expressió fixa amb en i hi: no és suficient."},{quote:"en tenen notícia",note:"En = del problema (complement amb de)."},{quote:"tanmateix",note:"Connector de contrast formal. Mai «sin embargo»."},{quote:"Per tot això, els sol·licito que",note:"Fórmula de petició + subjuntiu (enviïn, confirmin)."},{quote:"Atentament,",note:"Comiat formal coherent amb la salutació."}]},practice:[{type:"choice",q:"M'agrada aquest barri: ___ visc des de fa anys.",options:["hi","en","el"],answer:"hi",e:"Viure en un lloc → hi visc."},{type:"choice",q:"Del contracte, ja ___ hem parlat amb l'advocada.",options:["n'","hi","l'"],answer:"n'",e:"Parlar de → en; davant vocal, n'."},{type:"choice",q:"Tens pomes? Sí, ___ tinc dues.",options:["en","hi","les"],answer:"en",e:"Amb un numeral → en tinc dues."},{type:"choice",q:"Has pensat a pagar el rebut? Sí, ___ he pensat.",options:["hi","en","ho"],answer:"hi",e:"Pensar a + infinitiu → hi he pensat."},{type:"choice",q:"Vens de la feina? Sí, ___ vinc ara.",options:["en","hi","d'"],answer:"en",e:"Venir d'un lloc → en vinc."},{type:"choice",q:"Confies en el propietari? No, no ___ confio gens.",options:["hi","en","el"],answer:"hi",e:"Confiar en → hi confio."},{type:"gap",q:"Hi ha prou cadires? No, no ___ ha prou.",answers:["n'hi"],e:"No n'hi ha prou: en + hi davant de ha."},{type:"gap",q:"Vas al mercat? Ves-___ ara, que tanquen.",answers:["hi"],e:"Imperatiu + hi amb guionet: ves-hi."},{type:"gap",q:"Quantes habitacions té el pis? ___ té tres.",answers:["en"],e:"En té tres."},{type:"gap",q:"Escriu en una sola paraula: «Parla del problema» → ___",answers:["parla'n"],e:"Darrere de verb acabat en vocal: parla'n."},{type:"transform",q:"Substitueix el lloc: «Hem estat a Formentera tot l'estiu.»",answers:["Hi hem estat tot l'estiu"],e:"A Formentera → hi."},{type:"transform",q:"Substitueix el complement: «No tinc temps.»",answers:["No en tinc"],e:"Nom sense article (temps) → en."},{type:"transform",q:"Substitueix el complement: «Penso en les vacances.»",answers:["Hi penso"],e:"Pensar en → hi."},{type:"transform",q:"Substitueix el complement: «Hem parlat de la pujada del lloguer.»",answers:["N'hem parlat"],e:"Parlar de → en; davant vocal, n'."},{type:"fix",q:"Corregeix: «Sin embargo, el pis és petit.»",answers:["tanmateix","no obstant això"],e:"Tanmateix o no obstant això."},{type:"fix",q:"Corregeix: «Hi han molts pisos buits.»",answers:["hi ha"],e:"El verb existencial va en singular: hi ha molts pisos."},{type:"fix",q:"Corregeix: «Li escric per a que solucioni el problema.»",answers:["perquè","per tal que"],e:"Finalitat amb verb conjugat: perquè o per tal que."},{type:"choice",q:"Quina fórmula tanca una carta formal?",options:["Atentament,","Petons,","Fins aviat!"],answer:"Atentament,",e:"També: Cordialment,"},{type:"choice",q:"Quina frase és adequada en una queixa formal?",options:["Us agrairia que ho solucionéssiu com més aviat millor.","Arregleu-ho ja!","Vale, espero."],answer:"Us agrairia que ho solucionéssiu com més aviat millor.",e:"Petició cortesa amb condicional + subjuntiu."},{type:"choice",q:"«No n'hi ha prou» vol dir…",options:["no és suficient","no n'hi ha cap","és massa"],answer:"no és suficient",e:"Expressió molt útil a l'examen."}],skeleton:{brief:"Escriu una carta de queixa a l'empresa que t'ha venut una rentadora defectuosa. Completa l'esquelet.",template:`[Lloc], [data]

Benvolguda senyora Marí,

Em poso en contacte amb vostè en relació amb l'oferta de recepcionista que el seu hotel va publicar en un portal d'ocupació el dia 15 d'aquest mes.

Soc diplomada en Turisme i fa sis anys que treballo en el sector. Actualment soc responsable del torn de matí d'un hotel de Santa Eulària des Riu, on coordino un equip de cinc persones i gestiono les reserves de grups. L'experiència que he adquirit en aquesta feina m'ha permès atendre clients en quatre llengües, entre les quals hi ha el català, que faig servir cada dia.

M'interessa especialment la seva empresa perquè aposta per un turisme sostenible, un model amb el qual m'identifico plenament.
